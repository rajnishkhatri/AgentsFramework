# SearXNG settings for private sidecar / local development.
# JSON output enabled, rate limiter disabled (no Redis dependency).
# Only general web search category active.

use_default_settings: true

general:
  instance_name: "agent-searxng"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "agent-searxng-local-dev-key"
  limiter: false
  image_proxy: false
  public_instance: false

ui:
  static_use_hash: true

enabled_plugins:
  - 'Hash plugin'
  - 'Self Information'
  - 'Tracker URL remover'

engines:
  - name: google
    engine: google
    shortcut: g
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
  - name: bing
    engine: bing
    shortcut: bi
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
