[package]
name = "agentsframework"
version = "0.1.0"
description = "AgentsFramework macOS shell (Tauri)"
authors = ["Rajnish Khatri"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `devtools` enables the WKWebView Web Inspector even in release bundles, so we
# can debug the deployed (strict-CSP) page in the bundled app. Revisit before a
# real public release (gate behind a debug profile if devtools shouldn't ship).
tauri = { version = "2.11.3", features = ["devtools"] }
tauri-plugin-log = "2"
# P5 Step 2 — system-browser + custom-scheme deep-link auth
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = { version = "2.4.2", features = ["deep-link"] }
url = "2"
# PKCE (RFC 7636): verifier in the shell, S256 challenge = base64url(SHA256(verifier))
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
