# Live-testing run profiles — named targets for Playwright e2e/smoke/stress runs.
#
# WHY: stop hand-assembling `BASE_URL=... E2E_AUTHENTICATED=1 STRESS_PHASE=...`
# strings for every live run. Pick a profile instead:
#
#     TEST_PROFILE=stress pnpm test:e2e:stress
#     TEST_PROFILE=prod   pnpm test:e2e:t3
#
# HOW: `e2e/load-profile.ts` (read at the top of playwright.config.ts) fills any
# env var listed here that is currently UNSET. Precedence (12-factor / CLI
# convention — explicit > env > file > default): an env var already present on the
# command line ALWAYS wins, so `BASE_URL=... TEST_PROFILE=stress ...` overrides
# the profile's base_url. The loader never clobbers an existing value.
#
# SCOPE (deliberately narrow — see the config research, 2026-06-14): this file
# holds ONLY non-secret, version-controlled, client-side test-orchestration
# knobs. It does NOT configure the backend (that's AgentRuntimeSettings env +
# Terraform), the GoalJudge live posture (that's the GCS goal_judge_config.json,
# 30s TTL), or any secret (WorkOS creds stay in repo-root .env / Secret Manager).
# `E2E_AUTHENTICATED=1` here is just the non-secret SWITCH that tells
# global-setup to read those secrets from .env — the secrets are never here.

default_profile: local

profiles:
  # ── local dev server, real or mocked middleware; loops dark ──
  local:
    base_url: "http://localhost:3000"
    env:
      MOCK_MIDDLEWARE: "0"

  # ── live prod Cloud Run; Phase 0 active, loops 1-3 DARK by config ──
  prod:
    base_url: "https://agent-frontend-w65nrxwkiq-uc.a.run.app"
    env:
      E2E_AUTHENTICATED: "1"

  # ── loops-ON tagged stress revision (deploy-gcp skill §Tiered-Loops
  #    Stress Revision). Fill <hash> after deploying the --tag stress
  #    frontend revision whose MIDDLEWARE_URL points at the stress backend. ──
  stress:
    base_url: "https://stress---agent-frontend-w65nrxwkiq-uc.a.run.app"
    env:
      E2E_AUTHENTICATED: "1"
      # default to the full corpus, all phases; override per-run on the CLI
      # (e.g. STRESS_SMOKE=1 for one-case-per-phase carrier confirmation).
      STRESS_PHASE: ""
      STRESS_LIMIT: ""
    # Documents the BACKEND posture this profile EXPECTS. NOT applied by the
    # loader (deploy/GCS concern); printed as a reminder so a stress run against
    # a loops-OFF revision is caught early (it would all show escalation_reason=disabled).
    requires:
      backend_loops: "REFLEXION_ENABLED=1 PLANNING_PLAN_SOURCE=generated (tagged revision)"
      goal_judge: "gs://agent-prod-gcp-dev-agent-facts/ops/goal_judge_config.json"

  # ── memory-ON tagged revision for the cross-session memory stress run
  #    (memory_multisession_e2e_stress plan §4). The mem: thread bridge carries a
  #    per-case user_id, so the BFF must point at the memory-on backend. base_url
  #    is the --tag mem frontend revision (its MIDDLEWARE_URL must point at the
  #    mem-tagged backend revision, MEMORY_ENABLED=true). ──
  mem:
    # The live memory-ON frontend tag is `memui` (its MIDDLEWARE_URL points at
    # the mem-tagged backend). There is no `mem` frontend tag — `mem` is the
    # BACKEND tag. Override per-run with BASE_URL if the tag moves.
    base_url: "https://memui---agent-frontend-w65nrxwkiq-uc.a.run.app"
    env:
      E2E_AUTHENTICATED: "1"
      # default to the full corpus, all abilities; override per-run on the CLI
      # (e.g. MEM_SMOKE=1 for one-case-per-ability carrier confirmation).
      MEM_ABILITY: ""
      MEM_LIMIT: ""
    # Documents the BACKEND posture this profile EXPECTS (NOT applied by the
    # loader — deploy concern); printed as a reminder so a memory run against a
    # memory-OFF revision is caught early (every recall probe would show count:0).
    requires:
      backend_memory: "MEMORY_ENABLED=true (--tag mem backend revision; full_components fix deployed)"
      mem_backend: "Mem0MemoryBackend wired (MEM0_API_KEY present on the revision)"

  # ── Phase B tagged revision (chat_persistence_phaseb_gcp_e2e_validation plan).
  #    MEMORY_ENABLED=1 backend under --tag phaseb; frontend MIDDLEWARE_URL points
  #    at the phaseb backend tag. Fill base_url via fill_stress_profile_url.py. ──
  phaseb:
    # WorkOS redirect URIs only cover memui today — use TEST_PROFILE=mem with
    # memui MIDDLEWARE_URL pointed at the phaseb backend for authenticated runs.
    # Direct phaseb FE tag works only with E2E_BYPASS_AUTH locally (prod gate).
    base_url: "https://phaseb---agent-frontend-w65nrxwkiq-uc.a.run.app"
    env:
      E2E_BYPASS_AUTH: "1"
      PHASEB_LIMIT: ""
    requires:
      backend_memory: "MEMORY_ENABLED=1 (--tag phaseb backend revision)"
      mem_backend: "Mem0MemoryBackend wired (MEM0_API_KEY present on the revision)"

  # ── Hermes/memory-os adoptions stress revision (A1 budget+consolidation,
  #    A2 relevance floor, A3 salience tiers). docs/research/memory/
  #    hermes_adoptions_design.md. Same shape as `mem` but the backend tag
  #    `mem-hermes` additionally sets the A1/A2/A3 flags + autocapture write-back
  #    ON + a SMALL semantic budget so consolidation fires within a test batch. ──
  mem-hermes:
    base_url: "https://memhermesui---agent-frontend-w65nrxwkiq-uc.a.run.app"
    env:
      E2E_AUTHENTICATED: "1"
      MEM_ABILITY: ""
      MEM_LIMIT: ""
    requires:
      backend_memory: "MEMORY_ENABLED=true (--tag mem-hermes backend; full_components fix)"
      mem_backend: "Mem0MemoryBackend wired (MEM0_API_KEY present)"
      hermes_flags: >-
        MEMORY_AUTOCAPTURE_ENABLED=true, MEMORY_RECALL_MIN_RELEVANCE=0.3,
        MEMORY_AUTHORITATIVE_AT=0.8, MEMORY_BUDGET_SEMANTIC=5
        (small budget so A1 consolidation fires within a batch)
