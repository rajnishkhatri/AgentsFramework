info:
  description: AG-UI Agent Protocol routes exposed by agent_ui_adapter. Generated
    from Pydantic wire models.
  title: Agent UI Adapter
  version: 0.1.0
openapi: 3.1.0
paths:
  /agent/memory:
    get:
      operationId: listMemory
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListResponse'
          description: The caller's memory items
        '401':
          description: Unauthorized
        '503':
          description: Memory service unavailable
      summary: List the caller's own memory items
    post:
      operationId: createMemory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCreateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryItem'
          description: Created memory
        '401':
          description: Unauthorized
        '503':
          description: Memory service unavailable
      summary: Add a user-authored memory
  /agent/memory/{key}:
    delete:
      operationId: deleteMemory
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted
        '401':
          description: Unauthorized
        '404':
          description: Memory not found
      summary: Delete one of the caller's memories
  /agent/runs/stream:
    post:
      operationId: streamRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreateRequest'
        required: true
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                format: event-stream
                type: string
          description: AG-UI event stream
        '401':
          description: Unauthorized
      summary: Open an SSE stream of AG-UI events for a run
  /agent/runs/{run_id}:
    delete:
      operationId: cancelRun
      parameters:
      - in: path
        name: run_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStateView'
          description: Cancelled run state
        '404':
          description: Run not found
      summary: Cancel a run
    get:
      operationId: getRun
      parameters:
      - in: path
        name: run_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStateView'
          description: Run state
        '404':
          description: Run not found
      summary: Get run state
  /agent/threads:
    get:
      operationId: listThreads
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadListResponse'
          description: The caller's threads
        '401':
          description: Unauthorized
      summary: List the caller's own threads (newest-first, cursor)
    post:
      operationId: createThread
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadCreateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadState'
          description: Created thread
      summary: Create a thread
  /agent/threads/{thread_id}:
    delete:
      operationId: archiveThread
      parameters:
      - in: path
        name: thread_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Archived
        '401':
          description: Unauthorized
        '404':
          description: Thread not found
      summary: Archive (soft-delete) a thread
    get:
      operationId: getThread
      parameters:
      - in: path
        name: thread_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadState'
          description: Thread state
      summary: Get a thread
    patch:
      operationId: renameThread
      parameters:
      - in: path
        name: thread_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadRenameRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadState'
          description: Renamed thread
        '401':
          description: Unauthorized
        '404':
          description: Thread not found
      summary: Rename a thread
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Healthy
      summary: Liveness probe
