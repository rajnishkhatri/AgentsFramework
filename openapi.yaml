components:
  schemas:
    BaseEvent:
      $defs:
        EventType:
          description: The 17 AG-UI event-type discriminator strings.
          enum:
          - RUN_STARTED
          - RUN_FINISHED
          - RUN_ERROR
          - STEP_STARTED
          - STEP_FINISHED
          - TEXT_MESSAGE_START
          - TEXT_MESSAGE_CONTENT
          - TEXT_MESSAGE_END
          - TOOL_CALL_START
          - TOOL_CALL_ARGS
          - TOOL_CALL_END
          - TOOL_RESULT
          - STATE_SNAPSHOT
          - STATE_DELTA
          - MESSAGES_SNAPSHOT
          - RAW
          - CUSTOM
          title: EventType
          type: string
      additionalProperties: false
      description: Common header for every AG-UI event.
      properties:
        raw_event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Raw Event
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        type:
          $ref: '#/components/schemas/EventType'
      required:
      - type
      title: BaseEvent
      type: object
    Custom:
      additionalProperties: false
      properties:
        name:
          title: Name
          type: string
        raw_event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Raw Event
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        type:
          const: CUSTOM
          default: CUSTOM
          title: Type
          type: string
        value:
          additionalProperties: true
          title: Value
          type: object
      required:
      - name
      - value
      title: Custom
      type: object
    DomainEventBase:
      additionalProperties: false
      description: Common header for every internal domain event.
      properties:
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        trace_id:
          title: Trace Id
          type: string
      required:
      - trace_id
      title: DomainEventBase
      type: object
    EventType:
      description: The 17 AG-UI event-type discriminator strings.
      enum:
      - RUN_STARTED
      - RUN_FINISHED
      - RUN_ERROR
      - STEP_STARTED
      - STEP_FINISHED
      - TEXT_MESSAGE_START
      - TEXT_MESSAGE_CONTENT
      - TEXT_MESSAGE_END
      - TOOL_CALL_START
      - TOOL_CALL_ARGS
      - TOOL_CALL_END
      - TOOL_RESULT
      - STATE_SNAPSHOT
      - STATE_DELTA
      - MESSAGES_SNAPSHOT
      - RAW
      - CUSTOM
      title: EventType
      type: string
    HealthResponse:
      additionalProperties: false
      description: Response body of ``GET /healthz``.
      properties:
        adapter_version:
          title: Adapter Version
          type: string
        status:
          const: ok
          title: Status
          type: string
      required:
      - status
      - adapter_version
      title: HealthResponse
      type: object
    LLMMessageEnded:
      additionalProperties: false
      properties:
        message_id:
          title: Message Id
          type: string
        model:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Model
        output_text:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Output Text
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        tokens_in:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Tokens In
        tokens_out:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Tokens Out
        trace_id:
          title: Trace Id
          type: string
      required:
      - trace_id
      - message_id
      title: LLMMessageEnded
      type: object
    LLMMessageStarted:
      additionalProperties: false
      properties:
        input_text:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Input Text
        message_id:
          title: Message Id
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        trace_id:
          title: Trace Id
          type: string
      required:
      - trace_id
      - message_id
      title: LLMMessageStarted
      type: object
    LLMTokenEmitted:
      additionalProperties: false
      properties:
        delta:
          title: Delta
          type: string
        message_id:
          title: Message Id
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        trace_id:
          title: Trace Id
          type: string
      required:
      - trace_id
      - message_id
      - delta
      title: LLMTokenEmitted
      type: object
    MemoryCreateRequest:
      additionalProperties: false
      description: "Body of ``POST /agent/memory`` \u2014 a user-added (manual) memory.\n\
        \n``user_id`` is intentionally absent: the subject is the verified bearer\n\
        identity, never client-supplied (cross-user-leak guard)."
      properties:
        content:
          maxLength: 2000
          minLength: 1
          title: Content
          type: string
        key:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          default: null
          title: Key
        salience:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          default: null
          title: Salience
        type:
          default: semantic
          enum:
          - semantic
          - episodic
          - procedural
          title: Type
          type: string
      required:
      - content
      title: MemoryCreateRequest
      type: object
    MemoryItem:
      additionalProperties: false
      description: One stored memory item, surfaced to its owner in the panel.
      properties:
        content:
          title: Content
          type: string
        key:
          title: Key
          type: string
        salience:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: Salience
        type:
          anyOf:
          - enum:
            - semantic
            - episodic
            - procedural
            type: string
          - type: 'null'
          default: null
          title: Type
      required:
      - key
      - content
      title: MemoryItem
      type: object
    MemoryListResponse:
      $defs:
        MemoryItem:
          additionalProperties: false
          description: One stored memory item, surfaced to its owner in the panel.
          properties:
            content:
              title: Content
              type: string
            key:
              title: Key
              type: string
            salience:
              anyOf:
              - type: number
              - type: 'null'
              default: null
              title: Salience
            type:
              anyOf:
              - enum:
                - semantic
                - episodic
                - procedural
                type: string
              - type: 'null'
              default: null
              title: Type
          required:
          - key
          - content
          title: MemoryItem
          type: object
      additionalProperties: false
      description: "Response body of ``GET /agent/memory`` \u2014 the caller's own\
        \ items."
      properties:
        items:
          items:
            $ref: '#/components/schemas/MemoryItem'
          title: Items
          type: array
      title: MemoryListResponse
      type: object
    MemoryRecalled:
      additionalProperties: false
      description: "memory_layer_wiring plan Phase 3: the transparent-recall indicator's\n\
        count (wire: Custom ``memory_recalled``). METADATA ONLY \u2014 carries the\n\
        number of long-term memories the route node's recall returned, NEVER the\n\
        content (the privacy invariant; the owner sees their content only in the\n\
        memory panel). The frontend renders \"recalled N memories\" above the\nassistant\
        \ turn; 0 renders nothing."
      properties:
        count:
          title: Count
          type: integer
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        trace_id:
          title: Trace Id
          type: string
      required:
      - trace_id
      - count
      title: MemoryRecalled
      type: object
    MessagesSnapshot:
      additionalProperties: false
      properties:
        messages:
          items:
            additionalProperties: true
            type: object
          title: Messages
          type: array
        raw_event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Raw Event
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        type:
          const: MESSAGES_SNAPSHOT
          default: MESSAGES_SNAPSHOT
          title: Type
          type: string
      required:
      - messages
      title: MessagesSnapshot
      type: object
    Raw:
      additionalProperties: false
      properties:
        event:
          title: Event
          type: string
        raw_event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Raw Event
        source:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Source
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        type:
          const: RAW
          default: RAW
          title: Type
          type: string
      required:
      - event
      title: Raw
      type: object
    ReasoningSummarized:
      additionalProperties: false
      description: 'F10 Tier-2: one cheap-tier "why/how" recap per run (wire: Custom

        ``reasoning_summary``).'
      properties:
        text:
          title: Text
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        trace_id:
          title: Trace Id
          type: string
      required:
      - trace_id
      - text
      title: ReasoningSummarized
      type: object
    RunCreateRequest:
      additionalProperties: false
      description: Body of ``POST /agent/runs/stream`` and ``POST /agent/runs``.
      properties:
        agent_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Agent Id
        input:
          additionalProperties: true
          title: Input
          type: object
        thread_id:
          title: Thread Id
          type: string
      required:
      - thread_id
      - input
      title: RunCreateRequest
      type: object
    RunError:
      additionalProperties: false
      properties:
        code:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Code
        message:
          title: Message
          type: string
        raw_event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Raw Event
        run_id:
          title: Run Id
          type: string
        thread_id:
          title: Thread Id
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        type:
          const: RUN_ERROR
          default: RUN_ERROR
          title: Type
          type: string
      required:
      - run_id
      - thread_id
      - message
      title: RunError
      type: object
    RunFinished:
      additionalProperties: false
      properties:
        raw_event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Raw Event
        run_id:
          title: Run Id
          type: string
        thread_id:
          title: Thread Id
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        type:
          const: RUN_FINISHED
          default: RUN_FINISHED
          title: Type
          type: string
      required:
      - run_id
      - thread_id
      title: RunFinished
      type: object
    RunFinishedDomain:
      additionalProperties: false
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Error
        run_id:
          title: Run Id
          type: string
        thread_id:
          title: Thread Id
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        trace_id:
          title: Trace Id
          type: string
      required:
      - trace_id
      - run_id
      - thread_id
      title: RunFinishedDomain
      type: object
    RunStarted:
      additionalProperties: false
      properties:
        raw_event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Raw Event
        run_id:
          title: Run Id
          type: string
        thread_id:
          title: Thread Id
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        type:
          const: RUN_STARTED
          default: RUN_STARTED
          title: Type
          type: string
      required:
      - run_id
      - thread_id
      title: RunStarted
      type: object
    RunStartedDomain:
      additionalProperties: false
      properties:
        run_id:
          title: Run Id
          type: string
        thread_id:
          title: Thread Id
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        trace_id:
          title: Trace Id
          type: string
      required:
      - trace_id
      - run_id
      - thread_id
      title: RunStartedDomain
      type: object
    RunStateView:
      additionalProperties: false
      description: Response body of ``GET /agent/runs/{run_id}``.
      properties:
        completed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Completed At
        run_id:
          title: Run Id
          type: string
        started_at:
          format: date-time
          title: Started At
          type: string
        status:
          enum:
          - running
          - completed
          - cancelled
          - errored
          title: Status
          type: string
        thread_id:
          title: Thread Id
          type: string
      required:
      - run_id
      - thread_id
      - status
      - started_at
      - completed_at
      title: RunStateView
      type: object
    StateDelta:
      additionalProperties: false
      properties:
        delta:
          items:
            additionalProperties: true
            type: object
          title: Delta
          type: array
        raw_event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Raw Event
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        type:
          const: STATE_DELTA
          default: STATE_DELTA
          title: Type
          type: string
      required:
      - delta
      title: StateDelta
      type: object
    StateMutated:
      additionalProperties: false
      properties:
        delta:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          default: null
          title: Delta
        snapshot:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Snapshot
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        trace_id:
          title: Trace Id
          type: string
      required:
      - trace_id
      title: StateMutated
      type: object
    StateSnapshot:
      additionalProperties: false
      properties:
        raw_event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Raw Event
        snapshot:
          additionalProperties: true
          title: Snapshot
          type: object
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        type:
          const: STATE_SNAPSHOT
          default: STATE_SNAPSHOT
          title: Type
          type: string
      required:
      - snapshot
      title: StateSnapshot
      type: object
    StepFinished:
      additionalProperties: false
      properties:
        raw_event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Raw Event
        step_name:
          title: Step Name
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        type:
          const: STEP_FINISHED
          default: STEP_FINISHED
          title: Type
          type: string
      required:
      - step_name
      title: StepFinished
      type: object
    StepProgressed:
      additionalProperties: false
      properties:
        step_count:
          title: Step Count
          type: integer
        step_name:
          title: Step Name
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        trace_id:
          title: Trace Id
          type: string
      required:
      - trace_id
      - step_count
      - step_name
      title: StepProgressed
      type: object
    StepStarted:
      additionalProperties: false
      properties:
        raw_event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Raw Event
        step_name:
          title: Step Name
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        type:
          const: STEP_STARTED
          default: STEP_STARTED
          title: Type
          type: string
      required:
      - step_name
      title: StepStarted
      type: object
    TaskUnderstandingEditRequest:
      additionalProperties: false
      description: "Edit payload for the soft-gate understanding card (Phase 4).\n\
        \nWire shape consumed by the middleware edit endpoint \u2014 NEVER the\ncomponents\
        \ Pydantic type (M1: middleware never imports components/).\nBounds mirror\
        \ the components validation gates minus lexical grounding\n(``user_edited``\
        \ skips it: the human is the authority). ``trace_id``\nis echoed verbatim\
        \ from the run (F-R7 \u2014 the browser never mints one)."
      properties:
        restated_intent:
          maxLength: 600
          minLength: 1
          title: Restated Intent
          type: string
        success_conditions:
          items:
            type: string
          maxItems: 7
          minItems: 2
          title: Success Conditions
          type: array
        trace_id:
          minLength: 1
          title: Trace Id
          type: string
      required:
      - trace_id
      - restated_intent
      - success_conditions
      title: TaskUnderstandingEditRequest
      type: object
    TaskUnderstood:
      additionalProperties: false
      description: 'task_understanding plan Phase 3: plan-time intent restatement
        +

        success checklist for the soft-gate card (wire: Custom

        ``task_understanding``). ``source`` is the provenance tier

        (deterministic | generated | user_edited).'
      properties:
        confidence:
          title: Confidence
          type: number
        restated_intent:
          title: Restated Intent
          type: string
        source:
          title: Source
          type: string
        success_conditions:
          items:
            type: string
          title: Success Conditions
          type: array
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        trace_id:
          title: Trace Id
          type: string
      required:
      - trace_id
      - restated_intent
      - success_conditions
      - confidence
      - source
      title: TaskUnderstood
      type: object
    TextMessageContent:
      additionalProperties: false
      properties:
        delta:
          title: Delta
          type: string
        message_id:
          title: Message Id
          type: string
        raw_event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Raw Event
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        type:
          const: TEXT_MESSAGE_CONTENT
          default: TEXT_MESSAGE_CONTENT
          title: Type
          type: string
      required:
      - message_id
      - delta
      title: TextMessageContent
      type: object
    TextMessageEnd:
      additionalProperties: false
      properties:
        message_id:
          title: Message Id
          type: string
        raw_event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Raw Event
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        type:
          const: TEXT_MESSAGE_END
          default: TEXT_MESSAGE_END
          title: Type
          type: string
      required:
      - message_id
      title: TextMessageEnd
      type: object
    TextMessageStart:
      additionalProperties: false
      properties:
        message_id:
          title: Message Id
          type: string
        raw_event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Raw Event
        role:
          const: assistant
          title: Role
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        type:
          const: TEXT_MESSAGE_START
          default: TEXT_MESSAGE_START
          title: Type
          type: string
      required:
      - message_id
      - role
      title: TextMessageStart
      type: object
    ThreadCreateRequest:
      additionalProperties: false
      description: Body of ``POST /agent/threads``.
      properties:
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        user_id:
          title: User Id
          type: string
      required:
      - user_id
      title: ThreadCreateRequest
      type: object
    ThreadListResponse:
      $defs:
        ThreadState:
          additionalProperties: false
          description: "Response body of ``GET /agent/threads/{thread_id}`` and items\
            \ in the\n``GET /agent/threads`` list.\n\n``title`` is the sidebar label\
            \ (Phase 3) \u2014 deterministic from the first\nuser message, user-renamable.\
            \ ``archived_at`` is the soft-delete tombstone\n(set on archive; list/get\
            \ filter it out)."
          properties:
            archived_at:
              anyOf:
              - format: date-time
                type: string
              - type: 'null'
              default: null
              title: Archived At
            created_at:
              format: date-time
              title: Created At
              type: string
            messages:
              items:
                additionalProperties: true
                type: object
              title: Messages
              type: array
            thread_id:
              title: Thread Id
              type: string
            title:
              default: New chat
              title: Title
              type: string
            updated_at:
              format: date-time
              title: Updated At
              type: string
            user_id:
              title: User Id
              type: string
          required:
          - thread_id
          - user_id
          - created_at
          - updated_at
          title: ThreadState
          type: object
      additionalProperties: false
      description: "Response body of ``GET /agent/threads`` \u2014 the caller's own\
        \ threads,\ncursor-paginated."
      properties:
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Next Cursor
        threads:
          items:
            $ref: '#/components/schemas/ThreadState'
          title: Threads
          type: array
      title: ThreadListResponse
      type: object
    ThreadRenameRequest:
      additionalProperties: false
      description: "Body of ``PATCH /agent/threads/{thread_id}`` \u2014 rename only."
      properties:
        title:
          maxLength: 200
          minLength: 1
          title: Title
          type: string
      required:
      - title
      title: ThreadRenameRequest
      type: object
    ThreadState:
      additionalProperties: false
      description: "Response body of ``GET /agent/threads/{thread_id}`` and items\
        \ in the\n``GET /agent/threads`` list.\n\n``title`` is the sidebar label (Phase\
        \ 3) \u2014 deterministic from the first\nuser message, user-renamable. ``archived_at``\
        \ is the soft-delete tombstone\n(set on archive; list/get filter it out)."
      properties:
        archived_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Archived At
        created_at:
          format: date-time
          title: Created At
          type: string
        messages:
          items:
            additionalProperties: true
            type: object
          title: Messages
          type: array
        thread_id:
          title: Thread Id
          type: string
        title:
          default: New chat
          title: Title
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        user_id:
          title: User Id
          type: string
      required:
      - thread_id
      - user_id
      - created_at
      - updated_at
      title: ThreadState
      type: object
    ToolCallArgs:
      additionalProperties: false
      properties:
        delta:
          title: Delta
          type: string
        raw_event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Raw Event
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        tool_call_id:
          title: Tool Call Id
          type: string
        type:
          const: TOOL_CALL_ARGS
          default: TOOL_CALL_ARGS
          title: Type
          type: string
      required:
      - tool_call_id
      - delta
      title: ToolCallArgs
      type: object
    ToolCallEnd:
      additionalProperties: false
      properties:
        raw_event:
          anyOf:
          - additionalProperties: true
            type: object
