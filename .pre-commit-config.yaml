# Git-level sensor layer (Track A — defense in depth).
#
# These run at `git commit` for EVERYONE, regardless of editor — the backstop
# for edits made outside Claude Code (vim, a teammate, etc.). The same ruff
# checks also run as a Claude Code PostToolUse hook (fast, in-loop) and in CI
# (.github/workflows/pre-commit.yml — the un-bypassable layer, because
# `git commit --no-verify` skips these local hooks).
#
# Install once:  .venv/bin/pre-commit install
# Run manually:  .venv/bin/pre-commit run --all-files
#
# ruff rev is pinned to match the venv ruff (0.15.16) so the commit hook and
# local `make format` never disagree on formatting. Bump both together.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1024]

  # Cite + encoding lint for the REVIEW.md / AGENTS.md enforcement maps
  # (WI-2, P2-11, P3). Runs the full-repo scan only when a REVIEW.md or
  # AGENTS.md is staged. Catches dangling cites, cross-folder cites, and
  # mojibake at commit time — the same gate as `make check`, one layer
  # earlier. `pass_filenames: false` because cite-lint discovers files
  # itself via --root. Uses plain `python` (not `.venv/bin/python`) so the
  # same entry works in CI where there's no venv — cite_lint is stdlib-only
  # and doesn't import the logfire/opentelemetry stack that requires the
  # pinned venv interpreter.
  - repo: local
    hooks:
      - id: cite-lint
        name: cite-lint (REVIEW.md / AGENTS.md enforcement maps)
        entry: python -m code_reviewer.cite_lint --root .
        language: system
        pass_filenames: false
        files: '(^|/)(REVIEW|AGENTS)\.md$'

# Never touch generated / vendored trees.
exclude: |
  (?x)^(
      \.venv/.*|
      node_modules/.*|
      .*/node_modules/.*|
      .*\.min\.(js|css)|
      cache/.*|
      logs/.*
  )$
