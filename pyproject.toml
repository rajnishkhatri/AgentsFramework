[project]
name = "agent-trust-foundation"
version = "0.1.0"
description = "ReAct Agent with Dynamic Model Selection -- Phase 1"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0,<3",
    "python-json-logger>=3.0,<4",
    "pydantic-settings>=2.0,<3",

    "langgraph>=0.6,<1",
    "langchain-litellm>=0.6,<1",
    "litellm>=1.0,<2",
    "langsmith>=0.1,<1",
    "jinja2>=3.0,<4",
    "rich>=13.0,<15",
    "pyyaml>=6.0,<7",

    # agent_ui_adapter (Sprint S6) — FastAPI composition root + httpx test client
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",

    # middleware (Sprint 1) — WorkOS JWT verification, Mem0 long-term memory,
    # Langfuse telemetry. SDK imports confined to middleware/adapters/* per
    # rule F-R2 / A1 (no SDK types escape past adapter boundary).
    "PyJWT[crypto]>=2.8,<3",
    "mem0ai>=2.0,<3",
    "langfuse>=4.0,<5",
]

[project.optional-dependencies]
# guardrails (Sprint 0/3) — optional ONNX injection classifier for the Input
# rail. Absent => graceful degrade to deterministic pre-check + the existing
# narrow LLM judge (services/governance/injection_classifier.py). onnxruntime
# / tokenizers / onnx are NOT langgraph/langchain, so the Layer 2 service stays
# within AGENTS.md invariant #4. ``onnx`` is for smoke-artifact export only
# (scripts/train_injection_classifier.py smoke); runtime inference needs only
# onnxruntime + tokenizers. Approved ASK-FIRST in Sprint 0 (S0-2 / f2-deps).
guardrails = ["onnxruntime>=1.17,<2", "tokenizers>=0.15,<1", "onnx>=1.15,<2"]
aws = ["boto3>=1.34.0,<2"]
gcp = [
    "google-cloud-storage>=2.14.0,<3",
    "google-cloud-pubsub>=2.19.0,<3",
    "langgraph-checkpoint-postgres>=2.0.0,<4",
    "psycopg[binary]>=3.1.0,<4",
]
# sqlite (local dev checkpointer) — AsyncSqliteSaver / SqliteSaver used by
# cli.py, middleware/__main__.py, and scripts/run_goaljudge_synthetic_batch.py
# for local checkpointing. Pin <3.1: sqlite 3.1.0 requires checkpoint 4.x,
# which conflicts with the locked langgraph-checkpoint==3.0.1 (langgraph
# 0.6.11) stack and raises ImportError(DeltaChannelHistory).
sqlite = ["langgraph-checkpoint-sqlite>=3.0,<3.1"]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "hypothesis>=6.0,<7",
    "freezegun>=1.0,<2",
    "ruff>=0.4,<1",
    "pip-tools>=7.0,<8",
]
infra = [
    "python-hcl2>=7.0,<8",
    "pytest>=8.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trust", "utils", "components", "services", "orchestration", "meta", "StructuredReasoning", "agent_ui_adapter", "middleware", "explainability_app"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "simulation: marks tests as simulation-based (Layer 4)",
    "live_llm: marks tests that require real LLM API calls",
    "property: marks property-based tests (Hypothesis)",
    "infra: marks Sprint 2 OpenTofu/HCL infrastructure tests (run with `pytest tests/infra/`)",
]
testpaths = ["tests"]
# Skip tests/infra during default collection — that tree needs the `infra`
# extra (python-hcl2) and is run via `pytest tests/infra/ -m infra`.
norecursedirs = [
    ".git",
    ".hg",
    ".svn",
    ".tox",
    ".nox",
    ".venv",
    "venv",
    "dist",
    "build",
    "__pycache__",
    ".hypothesis",
    "*.egg",
    "infra",
]
# pythonpath = ["."] puts the repo root first so the LOCAL `tests/` package
# wins over any site-packages shadow (e.g. `terraform-compliance` ships its
# own `tests/` package which would otherwise shadow ours under
# `from tests.conftest import ...` style imports).
pythonpath = ["."]
addopts = "-m 'not slow and not simulation and not live_llm and not infra' --strict-markers"
asyncio_mode = "auto"
