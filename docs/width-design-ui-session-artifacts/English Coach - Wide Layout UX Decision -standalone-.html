document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ding:11px 10px;font-size:1.0625rem}\n  .toast-action,.toast-cancel{padding:10px 16px}\n  .dropdown-content{padding:6px}\n}\n/* Neutralise sticky hover on touch devices (no real hover) */\n@media (hover: none){\n  .btn-default:hover:not(:disabled){background:linear-gradient(180deg, color-mix(in oklab, var(--color-accent) 88%, #fff) 0%, var(--color-accent) 48%, color-mix(in oklab, var(--color-accent) 90%, #000) 100%);color:#fff}\n  .btn-outline:hover:not(:disabled){background:transparent;border-color:var(--color-border);color:var(--color-fg)}\n  .btn-ghost:hover:not(:disabled){background:transparent;color:var(--color-fg)}\n  .composer-iconbtn:hover{background:var(--color-surface);color:var(--color-muted)}\n  .composer-model:hover{background:transparent}\n  .dropdown-item:hover{background:transparent}\n  .tabs-trigger:hover{color:var(--color-muted)}\n  .nav-item:hover{background:transparent;color:var(--color-muted)}\n  .nav-item.is-active{background:var(--color-selected);color:var(--color-fg)}\n}\n<\u002Fstyle>\n<script src=\"d3ad926e-fff8-483b-a1a2-6993d1f58c5f\"><\u002Fscript>\n<style>\n  a{color:var(--color-accent);text-decoration:none}\n  a:hover{color:var(--color-accent);text-decoration:underline}\n  [data-refs=\"off\"] .refchip{display:none !important}\n  .sec{scroll-margin-top:64px}\n  .tag{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:.6rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid;white-space:nowrap}\n  .tag-accept{color:var(--color-success);border-color:color-mix(in oklab,var(--color-success) 40%,transparent);background:color-mix(in oklab,var(--color-success) 12%,transparent)}\n  .tag-refine{color:var(--color-accent);border-color:color-mix(in oklab,var(--color-accent) 45%,transparent);background:var(--color-accent-light)}\n  .tag-reject{color:var(--color-danger);border-color:color-mix(in oklab,var(--color-danger) 42%,transparent);background:color-mix(in oklab,var(--color-danger) 12%,transparent)}\n  .refchip{display:inline-flex;font-family:var(--font-mono);font-size:.66rem;padding:1px 7px;border:1px solid var(--color-border);border-radius:999px;color:var(--color-muted)}\n  .zlabel{position:absolute;top:-9px;left:14px;background:var(--color-bg);padding:0 8px;font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}\n  .ears{font-family:var(--font-mono);font-size:.82em;font-weight:700;color:var(--color-accent)}\n  .toclink{font-size:.82rem;color:var(--color-muted);padding:5px 10px;border-radius:999px;border:1px solid transparent;white-space:nowrap}\n  .toclink:hover{color:var(--color-accent);text-decoration:none;border-color:var(--color-border);background:var(--color-surface)}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div data-theme=\"{{ theme }}\" data-refs=\"{{ refs }}\" style=\"background:var(--color-bg);color:var(--color-fg);min-height:100vh;font-family:var(--font-sans);padding:0 0 64px\">\n  \n\n  <!-- ============ HEADER ============ -->\n  <div style=\"max-width:1120px;margin:0 auto;padding:30px 24px 8px\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;max-width:780px\">\n        <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n          <span class=\"refchip\">preact-english-coach<\u002Fspan>\n          <span style=\"font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--color-accent)\">UX Decision Record · /learn/*<\u002Fspan>\n        <\u002Fdiv>\n        <h1 style=\"font-size:2rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0\">Wide-layout &amp; coach-panel parity<\u002Fh1>\n        <p style=\"font-size:1.0625rem;color:var(--color-muted);line-height:1.5;text-wrap:pretty;margin:0\">Bring the desktop surface to parity with the iPad-landscape quiz+coach split: a collapsible left nav and a coach column that stays usable as the conversation grows. Everything below is decided so engineering can lift it straight into an EARS spec — no further design clarification on A–F.<\u002Fp>\n      <\u002Fdiv>\n      <button class=\"btn btn-outline btn-sm\" sc-camel-on-click=\"{{ toggleTheme }}\" style=\"flex:none\">Theme · {{ themeLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:16px\">\n      <span class=\"tag tag-accept\">Accept default<\u002Fspan><span style=\"font-size:.82rem;color:var(--color-muted)\">aligns with the proposed engineering default<\u002Fspan>\n      <span style=\"width:1px;height:16px;background:var(--color-border);margin:0 4px\"><\u002Fspan>\n      <span class=\"tag tag-refine\">Refine<\u002Fspan><span style=\"font-size:.82rem;color:var(--color-muted)\">keeps the intent, changes the mechanism<\u002Fspan>\n      <span style=\"width:1px;height:16px;background:var(--color-border);margin:0 4px\"><\u002Fspan>\n      <span class=\"tag tag-reject\">Reject<\u002Fspan><span style=\"font-size:.82rem;color:var(--color-muted)\">overrides a stated default<\u002Fspan>\n      <button class=\"refchip\" sc-camel-on-click=\"{{ toggleRefs }}\" style=\"cursor:pointer;margin-left:auto;background:var(--color-surface)\">FR refs · {{ refsLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ STICKY TOC ============ -->\n  <div style=\"position:sticky;top:0;z-index:5;background:color-mix(in oklab,var(--color-bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--color-border);margin-top:18px\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:8px 20px;display:flex;flex-wrap:wrap;gap:2px;align-items:center\">\n      <a class=\"toclink\" href=\"#decisions\">1 · Decision log<\u002Fa>\n      <a class=\"toclink\" href=\"#wireframes\">2 · Wireframes<\u002Fa>\n      <a class=\"toclink\" href=\"#inventory\">3 · Components<\u002Fa>\n      <a class=\"toclink\" href=\"#state\">4 · State model<\u002Fa>\n      <a class=\"toclink\" href=\"#acceptance\">5 · Acceptance<\u002Fa>\n      <a class=\"toclink\" href=\"#risks\">6 · Risks<\u002Fa>\n      <a class=\"toclink\" href=\"#nongoals\">7 · Non-goals<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1120px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:44px\">\n\n    <!-- ============ 1 · DECISION LOG ============ -->\n    <div class=\"sec\" id=\"decisions\" style=\"display:flex;flex-direction:column;gap:16px;padding-top:32px\">\n      <div style=\"display:flex;align-items:baseline;gap:12px\">\n        <span style=\"font-family:var(--font-mono);font-size:.82rem;color:var(--color-accent);font-weight:700\">01<\u002Fspan>\n        <h2 style=\"font-size:1.4rem;font-weight:700;letter-spacing:-.01em;margin:0\">Decision log<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size:.98rem;color:var(--color-muted);line-height:1.5;margin:0;max-width:760px\">Every question A1–F3 with a single clear choice and one line of rationale. Status tags mark alignment with the proposed engineering defaults. Two hard <span class=\"tag tag-reject\">Reject<\u002Fspan> calls: B1 (scope auto-collapse) and E1 (keep an in-place ask bridge).<\u002Fp>\n\n      <!-- GROUP A -->\n      <div style=\"margin-top:6px;display:flex;align-items:center;gap:10px\">\n        <span style=\"font-family:var(--font-mono);font-weight:700;font-size:.95rem;color:var(--color-accent)\">A<\u002Fspan>\n        <span style=\"font-weight:600;font-size:1.05rem\">Information architecture / surfaces<\u002Fspan>\n        <span style=\"flex:1;height:1px;background:var(--color-border)\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <!-- A1 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">A1<\u002Fspan>\n            <span class=\"tag tag-accept\">Accept<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Share one \"wide\" layout system across desktop &amp; iPad, or keep distinct surface labels?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">Keep the three surface <em>labels<\u002Fem> (<code style=\"font-family:var(--font-mono);font-size:.85em\">iphone/ipad/desktop<\u002Fcode>), but drive the split off a derived predicate <code style=\"font-family:var(--font-mono);font-size:.85em\">isWide = surface !== \"iphone\"<\u002Fcode>. One layout system, one code path; labels still feed nav membership.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> the labels already carry semantics (Skill in nav, focus screens) — collapsing them risks those; a boolean seam is the minimal change. <span class=\"refchip\">FR-J1/J2/J3<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- A2 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">A2<\u002Fspan>\n            <span class=\"tag tag-refine\">Refine<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Minimum width for the split? What happens at ~481–900px?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">Split requires <strong>≥ 900px of content width<\u002Fstrong> (viewport minus any open sidebar). Below that, degrade in a fixed order: <strong>(1)<\u002Fstrong> collapse sidebar to icon rail → <strong>(2)<\u002Fstrong> if still &lt; 900, hide the inline panel and offer a \"Coach\" control that opens it as an overlay drawer. Never stack coach below the item.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> a <em>content-width<\u002Fem> trigger composes with sidebar state, so collapsing the nav can rescue the split before anything is hidden; stacking would break the height chain and shove the item off-screen.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- A3 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">A3<\u002Fspan>\n            <span class=\"tag tag-refine\">Refine<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Is the right panel always visible, or dismissible / re-expandable?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">Visible by default; the learner <strong>can dismiss it<\u002Fstrong> to a thin labeled edge tab and re-expand. Dismissal persists per session. Dismissed ≠ gone — the thread survives and stays reachable from the Coach nav item.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> desktop is new here and desktop users expect to reclaim width for a long stem; a reversible dismiss beats an all-or-nothing rule.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- GROUP B -->\n      <div style=\"margin-top:12px;display:flex;align-items:center;gap:10px\">\n        <span style=\"font-family:var(--font-mono);font-weight:700;font-size:.95rem;color:var(--color-accent)\">B<\u002Fspan>\n        <span style=\"font-weight:600;font-size:1.05rem\">Sidebar collapse<\u002Fspan>\n        <span style=\"flex:1;height:1px;background:var(--color-border)\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <!-- B1 -->\n        <div style=\"display:flex;gap:14px;border:1px solid color-mix(in oklab,var(--color-danger) 30%,var(--color-border));border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">B1<\u002Fspan>\n            <span class=\"tag tag-reject\">Reject<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Auto-hide after <em>any<\u002Fem> nav selection, or only content-heavy screens?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">Auto-collapse only when entering a <strong>content-heavy focus screen<\u002Fstrong> — Quiz, Coach, Skill, Test. Home and Progress keep the sidebar expanded. <span style=\"color:var(--color-danger);font-weight:700\">Rejects<\u002Fspan> the blunt \"auto-collapse after any nav\" default.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> dashboards are navigation hubs — collapsing on arrival fights the user; the width win only matters where content is dense. <span class=\"refchip\">FR-B1<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- B2 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">B2<\u002Fspan>\n            <span class=\"tag tag-accept\">Accept<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Does Dashboard/Home keep the sidebar expanded by default?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">Yes. Home and Progress default to <strong>expanded<\u002Fstrong>; they are wayfinding surfaces, not focus surfaces.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> consistent with B1 — the collapse rule is keyed to the destination class, not the act of navigating.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- B3 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">B3<\u002Fspan>\n            <span class=\"tag tag-refine\">Refine<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Reopen control: placement, label, keyboard, does a thin rail remain?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">\"Collapsed\" = a persistent <strong>56px icon rail<\u002Fstrong>, never a full hide. A chevron toggle (<code style=\"font-family:var(--font-mono)\">⟨ / ☰<\u002Fcode>) at the rail top expands/collapses; <code style=\"font-family:var(--font-mono);font-size:.85em\">aria-label<\u002Fcode> \"Expand / Collapse sidebar\", real <code style=\"font-family:var(--font-mono);font-size:.85em\">&lt;button&gt;<\u002Fcode> (Tab + Enter/Space) plus a global <code style=\"font-family:var(--font-mono)\">[<\u002Fcode> shortcut. Icons keep hover tooltips + active state.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> a thin rail keeps every destination one click away — no trapped nav, meets ≥44px targets, avoids a disorienting blank gutter.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- B4 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">B4<\u002Fspan>\n            <span class=\"tag tag-refine\">Refine<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Where does ThemeToggle live when the sidebar is hidden?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">It never disappears. In the icon rail it becomes an <strong>icon-only toggle pinned at the rail bottom<\u002Fstrong>. Because we use a rail (not a full hide), theme is reachable on every screen.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> structurally forecloses the \"sidebar-trapped theme\" failure path called out in the brief. <span class=\"refchip\">FR-K1<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- B5 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">B5<\u002Fspan>\n            <span class=\"tag tag-accept\">Accept<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Persist collapsed/expanded across routes and reloads? Session vs local?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">Base preference persists in <strong>localStorage<\u002Fstrong> (<code style=\"font-family:var(--font-mono);font-size:.82em\">preact.shell.sidebar<\u002Fcode>), default expanded. The B1 auto-collapse fires on entering a content screen <em>unless<\u002Fem> the learner explicitly expanded this session (a <strong>sessionStorage<\u002Fstrong> \"user-pinned\" flag wins).<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> reload stability (local) without the auto rule fighting an explicit choice (session precedence).<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- GROUP C -->\n      <div style=\"margin-top:12px;display:flex;align-items:center;gap:10px\">\n        <span style=\"font-family:var(--font-mono);font-weight:700;font-size:.95rem;color:var(--color-accent)\">C<\u002Fspan>\n        <span style=\"font-weight:600;font-size:1.05rem\">Coach column structure<\u002Fspan>\n        <span style=\"flex:1;height:1px;background:var(--color-border)\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <!-- C1 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">C1<\u002Fspan>\n            <span class=\"tag tag-refine\">Refine<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Quiz CoachPanel stacking order, zones labeled fixed / sticky / scroll.<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">Three zones, top→bottom: <strong>A · FIXED<\u002Fstrong> chrome (title, status, current-item line, mode pills) → <strong>B · SCROLL<\u002Fstrong> the log (<code style=\"font-family:var(--font-mono);font-size:.82em\">role=\"log\"<\u002Fcode>: opener → revealed nudge bodies → coach turns) → <strong>C · PINNED<\u002Fstrong> action cluster (One-more-nudge button, chip row, composer).<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> moving nudge bodies <em>into<\u002Fem> the scroll zone is what resolves the brief's height-physics problem — revealed text no longer competes with pinned chrome for vertical space. See wireframe W3. <span class=\"refchip\">FR-J3a<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- C2 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">C2<\u002Fspan>\n            <span class=\"tag tag-refine\">Refine<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Same zone model for standalone <code style=\"font-family:var(--font-mono);font-size:.85em\">/learn/coach<\u002Fcode> (rail + strip). Differences?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">Same zone model. <strong>Desktop rail:<\u002Fstrong> Back/Wrap-up header (fixed) + left context rail (fixed) + right column = scroll log over pinned chips+composer. <strong>iPad strip:<\u002Fstrong> identical, chrome is a top strip instead of a left rail. Differences vs panel: adds Back/Wrap-up + history line; <strong>no \"One more nudge\"<\u002Fstrong> (no per-item ladder off-quiz).<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> one height-chain implementation, surface-specific chrome placement only. See wireframe W4. <span class=\"refchip\">BP-1.5<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- C3 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">C3<\u002Fspan>\n            <span class=\"tag tag-accept\">Accept<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Revealed nudge <em>texts<\u002Fem>: scroll, stay pinned under the button, or collapse?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">They <strong>scroll with the transcript<\u002Fstrong> — rendered as coach-authored bubbles inside the log (tagged \"Nudge 2 / 3\"). Only the \"One more nudge\" <em>button<\u002Fem> is pinned. Nudges do not collapse per-rung (they're one line each and form the ladder record).<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> a single scrollable reading surface; nudges become part of the thread narrative rather than a growing pinned block.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- C4 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">C4<\u002Fspan>\n            <span class=\"tag tag-accept\">Accept<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Chip row: pinned above composer, pinned under chrome, or scroll?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\"><strong>Pinned directly above the composer<\u002Fstrong>, inside the bottom cluster (Zone C).<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> chips seed the composer (\"Explain the rule simply\" → input), so they're compose-adjacent actions and must never scroll away.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- C5 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">C5<\u002Fspan>\n            <span class=\"tag tag-refine\">Refine<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Identical pin/scroll/collapse in panel vs standalone?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">The <strong>zone model and collapsible-answer behavior are identical<\u002Fstrong>. Only chrome placement differs (stacked-top panel / left-rail desktop / top-strip iPad), and standalone drops \"One more nudge\" and adds Back/Wrap-up.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> one mental model + one implementation of the physics; surface chrome is the only variable.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- GROUP D -->\n      <div style=\"margin-top:12px;display:flex;align-items:center;gap:10px\">\n        <span style=\"font-family:var(--font-mono);font-weight:700;font-size:.95rem;color:var(--color-accent)\">D<\u002Fspan>\n        <span style=\"font-weight:600;font-size:1.05rem\">Collapsible answers<\u002Fspan>\n        <span style=\"flex:1;height:1px;background:var(--color-border)\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <!-- D1 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">D1<\u002Fspan>\n            <span class=\"tag tag-refine\">Refine<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">What is visible in the collapsed state?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">One summary row: a \"Coach\" label + the <strong>first sentence<\u002Fstrong> (truncated, ellipsis) + a relative timestamp + an expand chevron (<code style=\"font-family:var(--font-mono)\">▸<\u002Fcode>). The paired user question stays visible above it (D3). The whole row is the click target.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> enough to recognise a turn while scanning; the question above supplies context so the first line need not repeat it.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- D2 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">D2<\u002Fspan>\n            <span class=\"tag tag-accept\">Accept<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Auto-collapse rules?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">When a new reply <strong>completes<\u002Fstrong>, auto-collapse all prior (non-error) coach answers; newest stays expanded; streaming stays expanded. A <strong>manual<\u002Fstrong> expand/collapse is remembered per-turn and always overrides the auto rule.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> keeps long threads scannable by default while honoring explicit intent — no fighting the user.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- D3 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">D3<\u002Fspan>\n            <span class=\"tag tag-refine\">Refine<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">User message bubbles: always expanded, or collapse with the pair?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\"><strong>User questions always stay visible.<\u002Fstrong> Collapse hides only the coach <em>answer<\u002Fem> body; the user prompt remains as the label for the collapsed answer.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> the question is the anchor; hiding it would make collapsed answers unidentifiable and defeat scanning.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- D4 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">D4<\u002Fspan>\n            <span class=\"tag tag-accept\">Accept<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Streaming stays expanded (confirm); Error+Retry when collapsed?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\"><strong>Confirmed:<\u002Fstrong> a streaming turn is force-expanded and cannot be collapsed until it completes. An <strong>errored turn is force-expanded and excluded from auto-collapse<\u002Fstrong> so its Retry stays visible.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> never bury a live spinner or a recovery action behind a chevron. <span class=\"refchip\">FR-F3/F4<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- D5 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">D5<\u002Fspan>\n            <span class=\"tag tag-refine\">Refine<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">a11y: how should aria-live / focus behave when collapsing mid-thread?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">The log stays <code style=\"font-family:var(--font-mono);font-size:.82em\">role=\"log\" aria-live=\"polite\"<\u002Fcode>. Collapse is a <code style=\"font-family:var(--font-mono);font-size:.82em\">&lt;button aria-expanded aria-controls&gt;<\u002Fcode> — it does <strong>not<\u002Fstrong> announce via the live region and does <strong>not<\u002Fstrong> move focus. Collapsed bodies use <code style=\"font-family:var(--font-mono);font-size:.82em\">hidden<\u002Fcode> (removed from the a11y tree). Auto-collapse of prior turns is silent; new streamed tokens still announce because the newest turn is expanded and live.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> no focus theft, no re-announcement of old content, new replies still reach screen readers. <span class=\"refchip\">U4<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- GROUP E -->\n      <div style=\"margin-top:12px;display:flex;align-items:center;gap:10px\">\n        <span style=\"font-family:var(--font-mono);font-weight:700;font-size:.95rem;color:var(--color-accent)\">E<\u002Fspan>\n        <span style=\"font-weight:600;font-size:1.05rem\">Feedback bridge &amp; empty states<\u002Fspan>\n        <span style=\"flex:1;height:1px;background:var(--color-border)\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <!-- E1 -->\n        <div style=\"display:flex;gap:14px;border:1px solid color-mix(in oklab,var(--color-danger) 30%,var(--color-border));border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">E1<\u002Fspan>\n            <span class=\"tag tag-reject\">Reject<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Remove \"Ask the coach\" on wide Feedback, or keep as secondary?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">Remove the <em>navigate<\u002Fem>, but <strong>keep an in-place bridge<\u002Fstrong>: \"Ask the coach about this\" pins the item context and <strong>moves focus to the panel composer<\u002Fstrong> — no route change. At the narrow drawer width it opens the drawer. <span style=\"color:var(--color-danger);font-weight:700\">Rejects<\u002Fspan> a clean \"drop Feedback→Coach\" reading of the default.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> the panel is already present so navigating is wrong, but the \"take this to the coach\" intent is valuable — preserve it as a focus bridge. iPhone keeps the navigate (no panel). <span class=\"refchip\">FR-5<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- E2 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">E2<\u002Fspan>\n            <span class=\"tag tag-accept\">Accept<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Cold coach (no pin): layout change or only chrome copy?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\"><strong>Copy only<\u002Fstrong>, no layout change. Status reads \"Ready when you are\", the current-item line is omitted, and the empty log shows just the opener bubble.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> layout stability across warm/cold states; honesty is expressed in copy, not structure.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- E3 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">E3<\u002Fspan>\n            <span class=\"tag tag-refine\">Refine<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Long stem left vs tall coach right: independent columns? linked height? who owns page scroll?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\"><strong>Two independent scroll columns; the window does not scroll<\u002Fstrong> on wide Quiz. The split row is height-locked to the viewport; the left (item) column scrolls internally if the stem+feedback overflow, the right (coach) column scrolls its log. Neither owns window scroll.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> generalises \"scroll only the coach\" to both columns; keeps composer, nudge, and both columns' chrome stable regardless of the other side's length.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- GROUP F -->\n      <div style=\"margin-top:12px;display:flex;align-items:center;gap:10px\">\n        <span style=\"font-family:var(--font-mono);font-weight:700;font-size:.95rem;color:var(--color-accent)\">F<\u002Fspan>\n        <span style=\"font-weight:600;font-size:1.05rem\">Visual / motion<\u002Fspan>\n        <span style=\"flex:1;height:1px;background:var(--color-border)\"><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <!-- F1 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">F1<\u002Fspan>\n            <span class=\"tag tag-accept\">Accept<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Sidebar collapse motion; reduced-motion rule.<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">A short <strong>160–200ms ease-out<\u002Fstrong> on rail width + content reflow. Under <code style=\"font-family:var(--font-mono);font-size:.82em\">prefers-reduced-motion: reduce<\u002Fcode> → instant, no transition.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> a brief transition reads as \"the same rail narrowing\", not a jump; reduced-motion is honored.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- F2 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">F2<\u002Fspan>\n            <span class=\"tag tag-accept\">Accept<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Answer collapse motion.<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">~<strong>150ms<\u002Fstrong> height + opacity on a single turn. When a new reply auto-collapses several prior turns, they change in <strong>one frame<\u002Fstrong> (no staggered cascade). Reduced-motion → instant.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> gentle and non-distracting; a cascade of animating rows on every reply would churn.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- F3 -->\n        <div style=\"display:flex;gap:14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:13px 15px\">\n          <div style=\"flex:none;width:76px;display:flex;flex-direction:column;gap:7px;align-items:flex-start\">\n            <span style=\"font-family:var(--font-mono);font-weight:700;font-size:1rem\">F3<\u002Fspan>\n            <span class=\"tag tag-refine\">Refine<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:.88rem;color:var(--color-muted);text-wrap:pretty\">Density change for the w-80 panel on desktop?<\u002Fdiv>\n            <div style=\"font-size:1rem;font-weight:600;line-height:1.42;text-wrap:pretty\">On desktop the panel grows from a fixed <code style=\"font-family:var(--font-mono);font-size:.82em\">w-80<\u002Fcode> (320px) to a fluid <code style=\"font-family:var(--font-mono);font-size:.82em\">clamp(340px, 32%, 460px)<\u002Fcode>; iPad keeps ≈320–360px. The item column takes the rest, capped at a ~680–720px reading measure.<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:var(--color-muted);line-height:1.45;text-wrap:pretty\"><em>Why:<\u002Fem> desktop has spare width — a slightly wider coach column improves chat readability; the clamp stops it dominating or starving the item.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ 2 · WIREFRAMES ============ -->\n    <div class=\"sec\" id=\"wireframes\" style=\"display:flex;flex-direction:column;gap:18px\">\n      <div style=\"display:flex;align-items:baseline;gap:12px\">\n        <span style=\"font-family:var(--font-mono);font-size:.82rem;color:var(--color-accent);font-weight:700\">02<\u002Fspan>\n        <h2 style=\"font-size:1.4rem;font-weight:700;letter-spacing:-.01em;margin:0\">Wireframes<\u002Fh2>\n      <\u002Fdiv>\n\n      <!-- LEGEND -->\n      <div class=\"etched\" style=\"border-radius:var(--radius-md);background:var(--color-surface);padding:12px 16px;display:flex;flex-wrap:wrap;gap:18px 26px;align-items:center;font-size:.84rem\">\n        <span style=\"font-weight:600;color:var(--color-muted);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase\">Zone key<\u002Fspan>\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:22px;height:14px;border:1.5px solid var(--color-fg);border-radius:4px;flex:none\"><\u002Fspan><span><strong>Fixed<\u002Fstrong> — never scrolls<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:22px;height:14px;border:1.5px solid var(--color-accent);background:var(--color-accent-light);border-radius:4px;flex:none\"><\u002Fspan><span><strong>Pinned / sticky<\u002Fstrong> — stays as log scrolls<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:22px;height:14px;border:1.5px dashed var(--color-muted);background:var(--color-surface-sunken);border-radius:4px;flex:none\"><\u002Fspan><span><strong>Scroll<\u002Fstrong> — <code style=\"font-family:var(--font-mono);font-size:.85em\">overflow-y:auto<\u002Fcode><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- W1 -->\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span class=\"refchip\" style=\"border-color:var(--color-accent);color:var(--color-accent)\">W1<\u002Fspan><span style=\"font-weight:600;font-size:1.02rem\">Wide Quiz — sidebar expanded<\u002Fspan><\u002Fdiv>\n        <div style=\"border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-surface-sunken);padding:14px;display:flex;gap:10px;height:320px\">\n          <!-- sidebar expanded -->\n          <div style=\"flex:none;width:150px;border:1.5px solid var(--color-fg);border-radius:var(--radius-md);background:var(--color-bg);display:flex;flex-direction:column;padding:10px 8px;gap:8px;position:relative\">\n            <span class=\"zlabel\" style=\"color:var(--color-fg)\">Fixed · 224px<\u002Fspan>\n            <div style=\"display:flex;justi ;color:var(--color-muted)\">unchanged<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:.86rem;color:var(--color-muted);margin:0;line-height:1.45\"><strong>Precedence:<\u002Fstrong> on entering a content screen, auto-collapse writes <code style=\"font-family:var(--font-mono);font-size:.85em\">sidebarCollapsed=true<\u002Fcode> unless <code style=\"font-family:var(--font-mono);font-size:.85em\">sidebarUserPinned<\u002Fcode> is set this session. A reload re-derives collapsible state (newest expanded, rest collapsed) — no per-turn persistence needed.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- ============ 5 · ACCEPTANCE CRITERIA ============ -->\n    <div class=\"sec\" id=\"acceptance\" style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"display:flex;align-items:baseline;gap:12px\">\n        <span style=\"font-family:var(--font-mono);font-size:.82rem;color:var(--color-accent);font-weight:700\">05<\u002Fspan>\n        <h2 style=\"font-size:1.4rem;font-weight:700;letter-spacing:-.01em;margin:0\">Acceptance criteria draft<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size:.98rem;color:var(--color-muted);line-height:1.5;margin:0;max-width:760px\">EARS-style, liftable into the SDD spec. <strong>Failure paths first.<\u002Fstrong><\u002Fp>\n\n      <div style=\"display:flex;flex-direction:column;gap:9px\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:-2px\"><span style=\"font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-danger)\">Failure &amp; edge paths<\u002Fspan><span style=\"flex:1;height:1px;background:color-mix(in oklab,var(--color-danger) 30%,var(--color-border))\"><\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;border:1px solid var(--color-border);border-left:3px solid var(--color-danger);border-radius:var(--radius-sm);background:var(--color-surface);padding:11px 14px\"><span style=\"font-family:var(--font-mono);font-weight:700;color:var(--color-danger);flex:none\">AC-1<\u002Fspan><div style=\"font-size:.94rem;line-height:1.5\"><span class=\"ears\">IF<\u002Fspan> content width is below 900px, <span class=\"ears\">THEN THE SYSTEM SHALL<\u002Fspan> collapse the sidebar to the icon rail before hiding the coach panel, and shall never stack the coach below the quiz item.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;border:1px solid var(--color-border);border-left:3px solid var(--color-danger);border-radius:var(--radius-sm);background:var(--color-surface);padding:11px 14px\"><span style=\"font-family:var(--font-mono);font-weight:700;color:var(--color-danger);flex:none\">AC-2<\u002Fspan><div style=\"font-size:.94rem;line-height:1.5\"><span class=\"ears\">IF<\u002Fspan> content width stays below 900px with the sidebar already collapsed, <span class=\"ears\">THEN THE SYSTEM SHALL<\u002Fspan> hide the inline panel and present a \"Coach\" control that opens it as an overlay drawer without navigating away.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;border:1px solid var(--color-border);border-left:3px solid var(--color-danger);border-radius:var(--radius-sm);background:var(--color-surface);padding:11px 14px\"><span style=\"font-family:var(--font-mono);font-weight:700;color:var(--color-danger);flex:none\">AC-3<\u002Fspan><div style=\"font-size:.94rem;line-height:1.5\"><span class=\"ears\">WHILE<\u002Fspan> a coach reply is streaming, <span class=\"ears\">THE SYSTEM SHALL<\u002Fspan> keep that turn expanded and prevent it from being collapsed, manually or automatically.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;border:1px solid var(--color-border);border-left:3px solid var(--color-danger);border-radius:var(--radius-sm);background:var(--color-surface);padding:11px 14px\"><span style=\"font-family:var(--font-mono);font-weight:700;color:var(--color-danger);flex:none\">AC-4<\u002Fspan><div style=\"font-size:.94rem;line-height:1.5\"><span class=\"ears\">IF<\u002Fspan> a coach turn is in an error state, <span class=\"ears\">THEN THE SYSTEM SHALL<\u002Fspan> keep it expanded and its Retry control reachable, excluding it from auto-collapse.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;border:1px solid var(--color-border);border-left:3px solid var(--color-danger);border-radius:var(--radius-sm);background:var(--color-surface);padding:11px 14px\"><span style=\"font-family:var(--font-mono);font-weight:700;color:var(--color-danger);flex:none\">AC-5<\u002Fspan><div style=\"font-size:.94rem;line-height:1.5\"><span class=\"ears\">WHEN<\u002Fspan> the last available ladder rung has been revealed, <span class=\"ears\">THE SYSTEM SHALL<\u002Fspan> disable \"One more nudge\" with an explanation and shall not hide or displace the composer.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;border:1px solid var(--color-border);border-left:3px solid var(--color-danger);border-radius:var(--radius-sm);background:var(--color-surface);padding:11px 14px\"><span style=\"font-family:var(--font-mono);font-weight:700;color:var(--color-danger);flex:none\">AC-6<\u002Fspan><div style=\"font-size:.94rem;line-height:1.5\"><span class=\"ears\">WHILE<\u002Fspan> the sidebar is collapsed, <span class=\"ears\">THE SYSTEM SHALL<\u002Fspan> keep the theme toggle reachable within the icon rail.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;border:1px solid var(--color-border);border-left:3px solid var(--color-danger);border-radius:var(--radius-sm);background:var(--color-surface);padding:11px 14px\"><span style=\"font-family:var(--font-mono);font-weight:700;color:var(--color-danger);flex:none\">AC-7<\u002Fspan><div style=\"font-size:.94rem;line-height:1.5\"><span class=\"ears\">WHEN<\u002Fspan> the learner collapses or expands a coach answer, <span class=\"ears\">THE SYSTEM SHALL<\u002Fspan> not move keyboard focus and shall not re-announce prior content through the live region.<\u002Fdiv><\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:8px;margin:8px 0 -2px\"><span style=\"font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-accent)\">Nominal behavior<\u002Fspan><span style=\"flex:1;height:1px;background:var(--color-border)\"><\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;border:1px solid var(--color-border);border-left:3px solid var(--color-accent);border-radius:var(--radius-sm);background:var(--color-surface);padding:11px 14px\"><span style=\"font-family:var(--font-mono);font-weight:700;color:var(--color-accent);flex:none\">AC-8<\u002Fspan><div style=\"font-size:.94rem;line-height:1.5\"><span class=\"ears\">WHERE<\u002Fspan> the surface is wide (desktop or iPad), <span class=\"ears\">THE SYSTEM SHALL<\u002Fspan> render the quiz item and the live coach panel side-by-side sharing one coach thread.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;border:1px solid var(--color-border);border-left:3px solid var(--color-accent);border-radius:var(--radius-sm);background:var(--color-surface);padding:11px 14px\"><span style=\"font-family:var(--font-mono);font-weight:700;color:var(--color-accent);flex:none\">AC-9<\u002Fspan><div style=\"font-size:.94rem;line-height:1.5\"><span class=\"ears\">WHILE<\u002Fspan> on a wide Quiz surface, <span class=\"ears\">THE SYSTEM SHALL<\u002Fspan> scroll the item column and the coach log independently and shall not scroll the browser window.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;border:1px solid var(--color-border);border-left:3px solid var(--color-accent);border-radius:var(--radius-sm);background:var(--color-surface);padding:11px 14px\"><span style=\"font-family:var(--font-mono);font-weight:700;color:var(--color-accent);flex:none\">AC-10<\u002Fspan><div style=\"font-size:.94rem;line-height:1.5\"><span class=\"ears\">THE SYSTEM SHALL<\u002Fspan> keep the composer, chip row, and \"One more nudge\" control pinned and visible regardless of coach-log scroll position.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;border:1px solid var(--color-border);border-left:3px solid var(--color-accent);border-radius:var(--radius-sm);background:var(--color-surface);padding:11px 14px\"><span style=\"font-family:var(--font-mono);font-weight:700;color:var(--color-accent);flex:none\">AC-11<\u002Fspan><div style=\"font-size:.94rem;line-height:1.5\"><span class=\"ears\">WHEN<\u002Fspan> a new coach reply completes, <span class=\"ears\">THE SYSTEM SHALL<\u002Fspan> collapse all prior non-error coach answers and keep the newest expanded.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;border:1px solid var(--color-border);border-left:3px solid var(--color-accent);border-radius:var(--radius-sm);background:var(--color-surface);padding:11px 14px\"><span style=\"font-family:var(--font-mono);font-weight:700;color:var(--color-accent);flex:none\">AC-12<\u002Fspan><div style=\"font-size:.94rem;line-height:1.5\"><span class=\"ears\">WHEN<\u002Fspan> the learner enters a content screen (Quiz / Coach / Skill / Test), <span class=\"ears\">THE SYSTEM SHALL<\u002Fspan> auto-collapse the sidebar unless the learner explicitly expanded it this session; Home and Progress shall stay expanded.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;border:1px solid var(--color-border);border-left:3px solid var(--color-accent);border-radius:var(--radius-sm);background:var(--color-surface);padding:11px 14px\"><span style=\"font-family:var(--font-mono);font-weight:700;color:var(--color-accent);flex:none\">AC-13<\u002Fspan><div style=\"font-size:.94rem;line-height:1.5\"><span class=\"ears\">WHEN<\u002Fspan> the learner dismisses the coach panel on wide Quiz, <span class=\"ears\">THE SYSTEM SHALL<\u002Fspan> preserve the coach thread and keep it reachable from the Coach nav item.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;border:1px solid var(--color-border);border-left:3px solid var(--color-accent);border-radius:var(--radius-sm);background:var(--color-surface);padding:11px 14px\"><span style=\"font-family:var(--font-mono);font-weight:700;color:var(--color-accent);flex:none\">AC-14<\u002Fspan><div style=\"font-size:.94rem;line-height:1.5\"><span class=\"ears\">WHEN<\u002Fspan> the learner activates \"Ask the coach about this\" on wide Feedback, <span class=\"ears\">THE SYSTEM SHALL<\u002Fspan> pin the item context and move focus to the coach composer without navigating.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;border:1px solid var(--color-border);border-left:3px solid var(--color-accent);border-radius:var(--radius-sm);background:var(--color-surface);padding:11px 14px\"><span style=\"font-family:var(--font-mono);font-weight:700;color:var(--color-accent);flex:none\">AC-15<\u002Fspan><div style=\"font-size:.94rem;line-height:1.5\"><span class=\"ears\">WHERE<\u002Fspan> prefers-reduced-motion is set, <span class=\"ears\">THE SYSTEM SHALL<\u002Fspan> apply sidebar and answer collapse changes instantly, with no transition; otherwise the sidebar preference persists across reloads via localStorage.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ 6 · RISKS + 7 · NON-GOALS ============ -->\n    <div style=\"display:flex;flex-wrap:wrap;gap:24px\">\n      <!-- RISKS -->\n      <div class=\"sec\" id=\"risks\" style=\"flex:1;min-width:320px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;align-items:baseline;gap:12px\">\n          <span style=\"font-family:var(--font-mono);font-size:.82rem;color:var(--color-accent);font-weight:700\">06<\u002Fspan>\n          <h2 style=\"font-size:1.4rem;font-weight:700;letter-spacing:-.01em;margin:0\">Open risks<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size:.92rem;color:var(--color-muted);margin:0;line-height:1.45\">Needs an eng spike before the spec locks.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:11px 13px;display:flex;flex-direction:column;gap:3px\"><div style=\"display:flex;align-items:center;gap:8px\"><span class=\"tag tag-reject\">Spike<\u002Fspan><span style=\"font-weight:600;font-size:.94rem\">Height chain on mobile Safari / iPad Safari<\u002Fspan><\u002Fdiv><div style=\"font-size:.86rem;color:var(--color-muted);line-height:1.42\"><code style=\"font-family:var(--font-mono);font-size:.85em\">100dvh<\u002Fcode> toolbar behavior + nested <code style=\"font-family:var(--font-mono);font-size:.85em\">min-h-0<\u002Fcode> flex + <code style=\"font-family:var(--font-mono);font-size:.85em\">overflow-y-auto<\u002Fcode> can collapse on iOS. Device-test before committing the chain.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:11px 13px;display:flex;flex-direction:column;gap:3px\"><div style=\"display:flex;align-items:center;gap:8px\"><span class=\"tag tag-reject\">Spike<\u002Fspan><span style=\"font-weight:600;font-size:.94rem\">Pinned composer inside overflow ancestor<\u002Fspan><\u002Fdiv><div style=\"font-size:.86rem;color:var(--color-muted);line-height:1.42\"><code style=\"font-family:var(--font-mono);font-size:.85em\">position:sticky<\u002Fcode> can fail under a transformed/overflow parent — prefer a flex bottom cluster; verify with real content.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:11px 13px;display:flex;flex-direction:column;gap:3px\"><div style=\"display:flex;align-items:center;gap:8px\"><span class=\"tag tag-refine\">Watch<\u002Fspan><span style=\"font-weight:600;font-size:.94rem\">Nested / dual-column scroll chaining<\u002Fspan><\u002Fdiv><div style=\"font-size:.86rem;color:var(--color-muted);line-height:1.42\">Two independent scroll columns + a drawer → overscroll chaining on trackpad/touch. Apply <code style=\"font-family:var(--font-mono);font-size:.85em\">overscroll-behavior:contain<\u002Fcode>.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:11px 13px;display:flex;flex-direction:column;gap:3px\"><div style=\"display:flex;align-items:center;gap:8px\"><span class=\"tag tag-refine\">Watch<\u002Fspan><span style=\"font-weight:600;font-size:.94rem\">Auto-collapse × aria-live<\u002Fspan><\u002Fdiv><div style=\"font-size:.86rem;color:var(--color-muted);line-height:1.42\">Confirm no double-announcement across browsers/SRs; confirm <code style=\"font-family:var(--font-mono);font-size:.85em\">hidden<\u002Fcode> removes bodies from the AX tree without breaking log semantics.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:11px 13px;display:flex;flex-direction:column;gap:3px\"><div style=\"display:flex;align-items:center;gap:8px\"><span class=\"tag tag-refine\">Watch<\u002Fspan><span style=\"font-weight:600;font-size:.94rem\">Drawer focus trap + return focus<\u002Fspan><\u002Fdiv><div style=\"font-size:.86rem;color:var(--color-muted);line-height:1.42\">At the narrow width, the overlay drawer needs a focus trap and return-focus to the trigger (a11y).<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:11px 13px;display:flex;flex-direction:column;gap:3px\"><div style=\"display:flex;align-items:center;gap:8px\"><span class=\"tag tag-refine\">Watch<\u002Fspan><span style=\"font-weight:600;font-size:.94rem\">Panel width vs long tokens<\u002Fspan><\u002Fdiv><div style=\"font-size:.86rem;color:var(--color-muted);line-height:1.42\">Long code/URL tokens in coach markdown can overflow the clamped panel — need <code style=\"font-family:var(--font-mono);font-size:.85em\">min-w-0<\u002Fcode> + wrap/break.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- NON-GOALS -->\n      <div class=\"sec\" id=\"nongoals\" style=\"flex:1;min-width:320px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;align-items:baseline;gap:12px\">\n          <span style=\"font-family:var(--font-mono);font-size:.82rem;color:var(--color-accent);font-weight:700\">07<\u002Fspan>\n          <h2 style=\"font-size:1.4rem;font-weight:700;letter-spacing:-.01em;margin:0\">Explicit non-goals<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size:.92rem;color:var(--color-muted);margin:0;line-height:1.45\">Not redesigned in this pass.<\u002Fp>\n        <div style=\"border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:6px 4px\">\n          <div style=\"display:flex;gap:9px;padding:8px 12px;font-size:.92rem;align-items:flex-start\"><span style=\"color:var(--color-danger);font-weight:700;flex:none\">✕<\u002Fspan><span>iPhone tab bar &amp; focus-mode chrome — untouched.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;padding:8px 12px;font-size:.92rem;align-items:flex-start;border-top:1px solid var(--color-border)\"><span style=\"color:var(--color-danger);font-weight:700;flex:none\">✕<\u002Fspan><span>Question / hint bank content; hint-rung pedagogy (probe / conceptual / narrowing); the non-reveal guarantee.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;padding:8px 12px;font-size:.92rem;align-items:flex-start;border-top:1px solid var(--color-border)\"><span style=\"color:var(--color-danger);font-weight:700;flex:none\">✕<\u002Fspan><span>Coach LLM behavior, prompts, or mode semantics.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;padding:8px 12px;font-size:.92rem;align-items:flex-start;border-top:1px solid var(--color-border)\"><span style=\"color:var(--color-danger);font-weight:700;flex:none\">✕<\u002Fspan><span>Auth / WorkOS.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;padding:8px 12px;font-size:.92rem;align-items:flex-start;border-top:1px solid var(--color-border)\"><span style=\"color:var(--color-danger);font-weight:700;flex:none\">✕<\u002Fspan><span>Backend / engine changes; any new npm dependency.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;padding:8px 12px;font-size:.92rem;align-items:flex-start;border-top:1px solid var(--color-border)\"><span style=\"color:var(--color-danger);font-weight:700;flex:none\">✕<\u002Fspan><span>Dashboard / Summary / Skill / Progress / Test screen internals — only their shell chrome + sidebar behavior change.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;padding:8px 12px;font-size:.92rem;align-items:flex-start;border-top:1px solid var(--color-border)\"><span style=\"color:var(--color-danger);font-weight:700;flex:none\">✕<\u002Fspan><span>Theme tokens / color palette.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-left:3px solid var(--color-accent);background:var(--color-accent-light);border-radius:0 var(--radius-md) var(--radius-md) 0;padding:11px 14px;font-size:.92rem;line-height:1.5;text-wrap:pretty\"><strong>Preserved invariants:<\u002Fstrong> one shared coach thread (panel ↔ <code style=\"font-family:var(--font-mono);font-size:.85em\">/learn/coach<\u002Fcode>), the reviewed hint ladder, and non-reveal nudges that never name the answer letter.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;'auto'|'light'|'dark'&quot;},&quot;showRefs&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { theme: null, refs: null };\n  componentDidMount(){\n    this._mq = window.matchMedia('(prefers-color-scheme: dark)');\n    this._onMq = () => { if(!this.state.theme) this.forceUpdate(); };\n    this._mq.addEventListener('change', this._onMq);\n  }\n  componentWillUnmount(){ if(this._mq) this._mq.removeEventListener('change', this._onMq); }\n  resolvedTheme(){\n    const pref = this.state.theme || this.props.theme || 'auto';\n    if(pref === 'auto') return (this._mq && this._mq.matches) ? 'dark' : 'light';\n    return pref;\n  }\n  resolvedRefs(){\n    if(this.state.refs != null) return this.state.refs;\n    return (this.props.showRefs ?? true) ? 'on' : 'off';\n  }\n  renderVals(){\n    const theme = this.resolvedTheme();\n    const refs = this.resolvedRefs();\n    return {\n      theme,\n      refs,\n      themeLabel: theme === 'dark' ? 'Dark' : 'Light',\n      refsLabel: refs === 'on' ? 'shown' : 'hidden',\n      toggleTheme: () => this.setState({ theme: this.resolvedTheme() === 'dark' ? 'light' : 'dark' }),\n      toggleRefs: () => this.setState({ refs: this.resolvedRefs() === 'on' ? 'off' : 'on' }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
