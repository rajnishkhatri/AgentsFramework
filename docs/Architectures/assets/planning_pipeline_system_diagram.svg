<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1480" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#424a53"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8250df"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#bf8700"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#cf222e"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #1f2328; }
      .subtitle { font-size: 14px; fill: #57606a; }
      .lane-num { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
      .lane-title { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
      .lane-intent { font-size: 12px; fill: #57606a; }
      .path-label { font-size: 13px; font-weight: 700; }
      .path-sub { font-size: 11px; fill: #57606a; }
      .node-title { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .node-sub { font-size: 12px; fill: #57606a; }
      .chip-text { font-size: 12px; fill: #1f2328; }
      .edge-label { font-size: 12px; font-weight: 600; fill: #424a53; }
      .edge-label-purple { font-size: 12px; font-weight: 600; fill: #8250df; }
      .edge-label-orange { font-size: 12px; font-weight: 600; fill: #9a6700; }
      .edge-label-red { font-size: 12px; font-weight: 600; fill: #cf222e; }
      .fork-text { font-size: 11px; font-weight: 700; fill: #8250df; }
      .legend-title { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .legend-text { font-size: 12px; fill: #1f2328; }
      .legend-note { font-size: 11px; fill: #57606a; }
    </style>
  </defs>

  <rect x="0" y="0" width="1920" height="1480" fill="#ffffff"/>

  <!-- Header -->
  <text x="960" y="44" text-anchor="middle" class="title">Planning Pipeline - Backend Runtime</text>
  <text x="960" y="72" text-anchor="middle" class="subtitle">orchestration/react_loop.py | L0/L1/L2 depth | T1/T2/T3 tiers | GoalJudge</text>

  <!-- ===== SWIMLANES with intent sidebar ===== -->
  <!-- Lane 1 INGRESS -->
  <rect x="200" y="100" width="1680" height="128" rx="10" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.5"/>
  <rect x="24" y="100" width="160" height="128" rx="10" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="44" y="128" class="lane-num" fill="#9a6700">ROW 1</text>
  <text x="44" y="150" class="lane-title" fill="#9a6700">INGRESS</text>
  <text x="44" y="172" class="lane-intent">Block unsafe</text>
  <text x="44" y="188" class="lane-intent">input before</text>
  <text x="44" y="204" class="lane-intent">any planning</text>

  <!-- Lane 2 PLAN -->
  <rect x="200" y="248" width="1680" height="220" rx="10" fill="#e8f4fd" stroke="#0969da" stroke-width="1.5"/>
  <rect x="24" y="248" width="160" height="220" rx="10" fill="#e8f4fd" stroke="#0969da" stroke-width="1.5"/>
  <text x="44" y="276" class="lane-num" fill="#0969da">ROW 2</text>
  <text x="44" y="298" class="lane-title" fill="#0969da">PLAN</text>
  <text x="44" y="320" class="lane-intent">Pick L0/L1/L2</text>
  <text x="44" y="336" class="lane-intent">depth, T1 plan,</text>
  <text x="44" y="352" class="lane-intent">task success</text>
  <text x="44" y="368" class="lane-intent">conditions</text>
  <text x="44" y="392" class="lane-intent">(route_node)</text>

  <!-- Lane 3 EXECUTE -->
  <rect x="200" y="488" width="1680" height="400" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <rect x="24" y="488" width="160" height="400" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="44" y="516" class="lane-num" fill="#424a53">ROW 3</text>
  <text x="44" y="538" class="lane-title" fill="#424a53">EXECUTE</text>
  <text x="44" y="560" class="lane-intent">Two mutually</text>
  <text x="44" y="576" class="lane-intent">exclusive paths</text>
  <text x="44" y="592" class="lane-intent">from route:</text>
  <text x="44" y="616" class="lane-intent">A = ReAct loop</text>
  <text x="44" y="632" class="lane-intent">B = T3 fan-out</text>

  <!-- Path A sub-region -->
  <rect x="228" y="528" width="780" height="340" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="248" y="554" class="path-label" fill="#0969da">Path A - Direct ReAct</text>
  <text x="248" y="572" class="path-sub">L0, supervisor decline, or fan-out disabled</text>

  <!-- Path B sub-region -->
  <rect x="1040" y="528" width="820" height="340" rx="10" fill="#fbf0ff" stroke="#8250df" stroke-width="2" stroke-dasharray="10 5"/>
  <text x="1060" y="554" class="path-label" fill="#8250df">Path B - T3 Fan-out</text>
  <text x="1060" y="572" class="path-sub">t3_fanout_enabled AND L1/L2 AND 2+ ordered plan steps</text>

  <!-- Vertical divider between paths -->
  <line x1="1020" y1="528" x2="1020" y2="868" stroke="#d0d7de" stroke-width="2"/>
  <text x="1010" y="710" text-anchor="middle" font-size="13" font-weight="700" fill="#8c959f">OR</text>

  <!-- Lane 4 EVALUATE -->
  <rect x="200" y="908" width="1680" height="168" rx="10" fill="#e8f5e8" stroke="#1a7f37" stroke-width="1.5"/>
  <rect x="24" y="908" width="160" height="168" rx="10" fill="#e8f5e8" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="44" y="936" class="lane-num" fill="#1a7f37">ROW 4</text>
  <text x="44" y="958" class="lane-title" fill="#1a7f37">EVALUATE</text>
  <text x="44" y="980" class="lane-intent">Score answer:</text>
  <text x="44" y="996" class="lane-intent">synthesis +</text>
  <text x="44" y="1012" class="lane-intent">keywords +</text>
  <text x="44" y="1028" class="lane-intent">GoalJudge</text>

  <!-- Lane 5 EXIT -->
  <rect x="200" y="1096" width="1680" height="120" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <rect x="24" y="1096" width="160" height="120" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="44" y="1124" class="lane-num" fill="#424a53">ROW 5</text>
  <text x="44" y="1146" class="lane-title" fill="#424a53">EXIT</text>
  <text x="44" y="1168" class="lane-intent">Recap and</text>
  <text x="44" y="1184" class="lane-intent">terminate run</text>

  <!-- ===== NODES ===== -->

  <!-- START -->
  <circle cx="300" cy="164" r="30" fill="#0969da" stroke="#0550ae" stroke-width="2"/>
  <text x="300" y="170" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">START</text>

  <!-- guard_input -->
  <g transform="translate(420, 132)">
    <rect width="180" height="64" rx="10" fill="#e8f4fd" stroke="#0969da" stroke-width="2"/>
    <path d="M14,20 L28,12 L42,20 L42,36 Q28,46 14,36 Z" fill="none" stroke="#1a7f37" stroke-width="1.8"/>
    <text x="100" y="30" text-anchor="middle" class="node-title">guard_input</text>
    <text x="100" y="50" text-anchor="middle" class="node-sub">InputGuardrail LLM</text>
  </g>

  <!-- Rejected END -->
  <circle cx="720" cy="164" r="30" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
  <text x="720" y="170" text-anchor="middle" font-size="13" fill="#cf222e" font-weight="700">END</text>

  <!-- route_node - wider 2x2 grid -->
  <g transform="translate(520, 300)">
    <rect width="560" height="148" rx="10" fill="#e8f4fd" stroke="#0969da" stroke-width="2"/>
    <text x="280" y="28" text-anchor="middle" class="node-title">route_node</text>
    <rect x="20" y="44" width="250" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="145" y="65" text-anchor="middle" class="chip-text">select_planning_depth (L0/L1/L2)</text>
    <rect x="290" y="44" width="250" height="32" rx="6" fill="#fff8e6" stroke="#bf8700"/>
    <text x="415" y="65" text-anchor="middle" class="chip-text">T1 PlanGenerator LLM</text>
    <rect x="20" y="88" width="250" height="32" rx="6" fill="#ddf4ff" stroke="#0969da"/>
    <text x="145" y="109" text-anchor="middle" class="chip-text">TaskUnderstanding LLM</text>
    <rect x="290" y="88" width="250" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="415" y="109" text-anchor="middle" class="chip-text">select_model + reflections</text>
    <text x="280" y="136" text-anchor="middle" class="node-sub">max steps: L0=1 | L1=3 | L2=5</text>
  </g>

  <!-- Fork diamond at route output -->
  <polygon points="800,448 830,468 800,488 770,468" fill="#ffffff" stroke="#424a53" stroke-width="2"/>
  <text x="800" y="472" text-anchor="middle" font-size="10" font-weight="700" fill="#424a53">?</text>

  <!-- call_llm -->
  <g transform="translate(380, 640)">
    <rect width="190" height="80" rx="10" fill="#e8f4fd" stroke="#0969da" stroke-width="2"/>
    <polygon points="152,40 168,26 184,40 168,54" fill="#fff8e6" stroke="#bf8700" stroke-width="1.8"/>
    <text x="88" y="38" text-anchor="middle" class="node-title">call_llm</text>
    <text x="88" y="58" text-anchor="middle" class="node-sub">ReAct + output guardrail</text>
    <text x="88" y="74" text-anchor="middle" class="node-sub">routed model tier</text>
  </g>

  <!-- execute_tool -->
  <g transform="translate(380, 760)">
    <rect width="190" height="80" rx="10" fill="#e8f4fd" stroke="#0969da" stroke-width="2"/>
    <path d="M12,22 L26,14 L40,22 L40,38 Q26,48 12,38 Z" fill="none" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="98" y="38" text-anchor="middle" class="node-title">execute_tool</text>
    <text x="98" y="58" text-anchor="middle" class="node-sub">Pydantic validators</text>
    <text x="98" y="74" text-anchor="middle" class="node-sub">shell + file_io</text>
  </g>

  <!-- T3 nodes -->
  <g transform="translate(1100, 640)">
    <rect width="170" height="72" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
    <text x="85" y="32" text-anchor="middle" class="node-title">supervisor</text>
    <text x="85" y="52" text-anchor="middle" class="node-sub">supervisor_decompose.j2</text>
  </g>
  <g transform="translate(1320, 640)">
    <rect width="150" height="72" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
    <text x="75" y="32" text-anchor="middle" class="node-title">worker xN</text>
    <text x="75" y="52" text-anchor="middle" class="node-sub">delegation_worker</text>
  </g>
  <g transform="translate(1520, 640)">
    <rect width="150" height="72" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
    <text x="75" y="32" text-anchor="middle" class="node-title">join</text>
    <text x="75" y="52" text-anchor="middle" class="node-sub">fanout_join.j2</text>
  </g>
  <text x="1285" y="760" text-anchor="middle" class="node-sub">synthesizes: task_input + worker_results</text>

  <!-- evaluate -->
  <g transform="translate(520, 948)">
    <rect width="640" height="96" rx="10" fill="#e8f5e8" stroke="#1a7f37" stroke-width="2"/>
    <text x="320" y="28" text-anchor="middle" class="node-title">evaluate_node</text>
    <rect x="20" y="42" width="150" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="95" y="63" text-anchor="middle" class="chip-text">validate_synthesis</text>
    <rect x="185" y="42" width="160" height="32" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="265" y="63" text-anchor="middle" class="chip-text">evaluate_task_outcome</text>
    <rect x="360" y="42" width="130" height="32" rx="6" fill="#fff8e6" stroke="#bf8700"/>
    <text x="425" y="63" text-anchor="middle" class="chip-text">GoalJudge LLM</text>
    <text x="320" y="88" text-anchor="middle" class="node-sub">writes last_task_outcome + last_unmet_conditions</text>
  </g>

  <!-- reflect -->
  <g transform="translate(1280, 960)">
    <rect width="150" height="72" rx="10" fill="#fff8e6" stroke="#bf8700" stroke-width="2"/>
    <text x="75" y="34" text-anchor="middle" class="node-title">reflect</text>
    <text x="75" y="54" text-anchor="middle" class="node-sub">T2 reflexion LLM</text>
    <text x="75" y="70" text-anchor="middle" class="node-sub">(if enabled)</text>
  </g>

  <!-- reasoning_recap -->
  <g transform="translate(520, 1128)">
    <rect width="220" height="64" rx="10" fill="#e8f4fd" stroke="#0969da" stroke-width="2"/>
    <text x="110" y="30" text-anchor="middle" class="node-title">reasoning_recap</text>
    <text x="110" y="50" text-anchor="middle" class="node-sub">reasoning_recap.j2 (fast tier)</text>
  </g>

  <!-- END -->
  <circle cx="860" cy="1160" r="30" fill="#424a53" stroke="#1f2328" stroke-width="2"/>
  <text x="860" y="1166" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">END</text>

  <!-- Merge bar before evaluate -->
  <rect x="480" y="892" width="720" height="8" rx="4" fill="#d0d7de"/>
  <text x="840" y="906" text-anchor="middle" class="path-sub">Both paths converge here</text>

  <!-- ===== ARROWS ===== -->

  <!-- START -> guard_input -->
  <line x1="330" y1="164" x2="418" y2="164" stroke="#424a53" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- guard_input -> route -->
  <path d="M600,164 L760,164 L760,300 L800,300" fill="none" stroke="#424a53" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="612" y="144" width="72" height="20" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="648" y="158" text-anchor="middle" class="edge-label">accepted</text>

  <!-- guard_input -> END rejected -->
  <line x1="600" y1="164" x2="690" y2="164" stroke="#cf222e" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <rect x="612" y="172" width="68" height="20" rx="4" fill="#ffffff" stroke="#ffd8d3"/>
  <text x="646" y="186" text-anchor="middle" class="edge-label-red">rejected</text>

  <!-- route -> fork -->
  <line x1="800" y1="448" x2="800" y2="468" stroke="#424a53" stroke-width="2.5"/>

  <!-- fork -> Path A (direct) -->
  <path d="M770,468 L475,468 L475,680 L380,680" fill="none" stroke="#424a53" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="560" y="450" width="96" height="20" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="608" y="464" text-anchor="middle" class="edge-label">direct / decline</text>

  <!-- fork -> Path B (supervisor) -->
  <path d="M830,468 L1120,468 L1120,640 L1100,640" fill="none" stroke="#8250df" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="900" y="450" width="150" height="20" rx="4" fill="#ffffff" stroke="#e6d8ff"/>
  <text x="975" y="464" text-anchor="middle" class="edge-label-purple">_route_to_supervisor</text>

  <!-- supervisor -> worker -> join -->
  <line x1="1270" y1="676" x2="1318" y2="676" stroke="#8250df" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <line x1="1470" y1="676" x2="1518" y2="676" stroke="#8250df" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- join -> evaluate (Path B) -->
  <path d="M1595,712 L1595,996 L1160,996" fill="none" stroke="#8250df" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="1420" y="978" width="96" height="20" rx="4" fill="#ffffff" stroke="#e6d8ff"/>
  <text x="1468" y="992" text-anchor="middle" class="edge-label-purple">Path B out</text>

  <!-- call_llm <-> execute_tool loop -->
  <line x1="475" y1="720" x2="475" y2="758" stroke="#424a53" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="482" y="728" width="72" height="20" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="518" y="742" text-anchor="middle" class="edge-label">tool_call</text>
  <path d="M570,800 L640,800 L640,680 L570,680" fill="none" stroke="#424a53" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="644" y="788" width="64" height="20" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="676" y="802" text-anchor="middle" class="edge-label">continue</text>

  <!-- call_llm -> evaluate (final_answer, Path A) -->
  <path d="M380,640 L320,640 L320,996 L520,996" fill="none" stroke="#424a53" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="328" y="820" width="88" height="20" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="372" y="834" text-anchor="middle" class="edge-label">final_answer</text>

  <!-- execute_tool -> evaluate -->
  <path d="M380,840 L340,840 L340,996 L520,996" fill="none" stroke="#424a53" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- evaluate -> reflect (T2) -->
  <line x1="1160" y1="996" x2="1278" y2="996" stroke="#bf8700" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arrow-orange)"/>
  <rect x="1170" y="978" width="72" height="20" rx="4" fill="#ffffff" stroke="#ffe8b0"/>
  <text x="1206" y="992" text-anchor="middle" class="edge-label-orange">reflect T2</text>

  <!-- reflect -> route (re-enter) - right margin, avoids Path A and legend -->
  <path d="M1430,960 L1880,960 L1880,280 L1080,280" fill="none" stroke="#bf8700" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arrow-orange)"/>
  <rect x="1788" y="262" width="100" height="20" rx="4" fill="#ffffff" stroke="#ffe8b0"/>
  <text x="1838" y="276" text-anchor="middle" class="edge-label-orange">re-enter route</text>

  <!-- evaluate -> reasoning_recap (done) -->
  <path d="M840,1044 L840,1128" fill="none" stroke="#424a53" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="848" y="1076" width="44" height="20" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="870" y="1090" text-anchor="middle" class="edge-label">done</text>

  <!-- reasoning_recap -> END -->
  <line x1="740" y1="1160" x2="830" y2="1160" stroke="#424a53" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== LEGEND (bottom right, below exit row content) ===== -->
  <rect x="1280" y="1096" width="580" height="340" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="1304" y="1128" class="legend-title">Legend</text>

  <rect x="1304" y="1144" width="40" height="24" rx="4" fill="#e8f4fd" stroke="#0969da" stroke-width="1.5"/>
  <text x="1356" y="1162" class="legend-text">Orchestration node</text>

  <rect x="1304" y="1176" width="40" height="24" rx="4" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="1356" y="1194" class="legend-text">Deterministic component</text>

  <rect x="1304" y="1208" width="40" height="24" rx="4" fill="#fff8e6" stroke="#bf8700"/>
  <text x="1356" y="1226" class="legend-text">LLM call site</text>

  <path d="M1310,1244 L1324,1234 L1338,1244 L1338,1258 Q1324,1268 1310,1258 Z" fill="none" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="1356" y="1258" class="legend-text">Guardrail gate</text>

  <line x1="1304" y1="1278" x2="1344" y2="1278" stroke="#8250df" stroke-width="2.5"/>
  <text x="1356" y="1284" class="legend-text">T3 fan-out path (Path B)</text>

  <line x1="1304" y1="1304" x2="1344" y2="1304" stroke="#424a53" stroke-width="2.5"/>
  <text x="1356" y="1310" class="legend-text">Direct ReAct path (Path A)</text>

  <line x1="1304" y1="1330" x2="1344" y2="1330" stroke="#bf8700" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="1356" y="1336" class="legend-text">T2 reflexion loop (optional re-plan)</text>

  <rect x="1304" y="1348" width="40" height="24" rx="4" fill="#fbf0ff" stroke="#8250df"/>
  <text x="1356" y="1366" class="legend-text">T3 subgraph node</text>

  <text x="1304" y="1400" class="legend-note">Depth L0/L1/L2 is orthogonal to tiers T1/T2/T3</text>
  <text x="1304" y="1420" class="legend-note">Planning folded into route_node (no planner_node)</text>
</svg>
