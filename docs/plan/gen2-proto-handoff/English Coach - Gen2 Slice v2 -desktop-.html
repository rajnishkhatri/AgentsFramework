  <script>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 Coach<\/strong><\/div><sc-for list=\"{{ navItems }}\" as=\"n\" hint-placeholder-count=\"5\"><button class=\"{{ n.cls }}\" onclick=\"{{ n.onClick }}\" style=\"font-family:var(--font-sans);font-size:1.125rem;cursor:pointer\"><span style=\"width:18px;text-align:center\">{{ n.icon }}<\/span><span>{{ n.label }}<\/span><\/button><\/sc-for><\/aside>\n          <div style=\"flex:1;min-width:0;padding:28px 30px;display:flex;flex-direction:column;gap:22px;overflow:hidden\">\n            <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap\"><div><h1 style=\"font-size:1.75rem;font-weight:600;letter-spacing:-.02em\">You’re on track for 28<\/h1><p class=\"text-muted\" style=\"font-size:1.05rem\">147 items reviewed · 9-day streak<\/p><\/div><div class=\"tabs-list\"><sc-for list=\"{{ rangeTabs }}\" as=\"t\" hint-placeholder-count=\"2\"><button class=\"{{ t.cls }}\" onclick=\"{{ t.onClick }}\" style=\"font-family:var(--font-sans);cursor:pointer\">{{ t.label }}<\/button><\/sc-for><\/div><\/div>\n            <div style=\"border:1px solid var(--color-border);border-radius:16px;padding:20px;background:var(--color-surface);display:flex;gap:24px;flex-wrap:wrap;align-items:center\"><div style=\"display:flex;flex-direction:column;gap:2px\"><span class=\"text-muted\" style=\"font-size:.85rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase\">Projected score<\/span><div style=\"display:flex;align-items:flex-end;gap:8px\"><span style=\"font-size:2.6rem;font-weight:700;line-height:1\">26<\/span><span style=\"color:var(--color-success);font-size:1rem;font-weight:600;margin-bottom:6px\">{{ trendDelta }}<\/span><\/div><span class=\"text-muted\" style=\"font-size:.92rem\">{{ trendSub }}<\/span><\/div><svg viewBox=\"0 0 360 120\" style=\"flex:1;min-width:260px;height:120px\" preserveAspectRatio=\"none\"><line x1=\"0\" y1=\"90\" x2=\"360\" y2=\"90\" stroke=\"var(--color-border)\" stroke-width=\"1\"><\/line><line x1=\"0\" y1=\"30\" x2=\"360\" y2=\"30\" stroke=\"var(--color-border)\" stroke-width=\"1\" stroke-dasharray=\"4 5\"><\/line><polyline points=\"{{ trendPoints }}\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/polyline><circle cx=\"360\" cy=\"42\" r=\"5\" fill=\"var(--color-accent)\"><\/circle><text x=\"356\" y=\"24\" font-size=\"13\" fill=\"var(--color-muted)\" text-anchor=\"end\">goal 28<\/text><\/svg><\/div>\n            <div><h3 style=\"font-size:1.1rem;font-weight:600;margin-bottom:12px\">Punctuation is the drag on your score<\/h3><div style=\"display:flex;flex-direction:column;gap:11px\"><sc-for list=\"{{ buckets }}\" as=\"b\" hint-placeholder-count=\"6\"><div style=\"--c:{{ b.color }};display:flex;align-items:center;gap:14px\"><div style=\"width:152px;flex:none;display:flex;align-items:center;gap:9px\"><span style=\"width:11px;height:11px;border-radius:4px;background:var(--c);flex:none\"><\/span><span style=\"font-size:1rem;font-weight:500\">{{ b.name }}<\/span><\/div><div style=\"flex:1;height:14px;border-radius:999px;background:var(--color-surface-sunken);overflow:hidden\"><div style=\"height:100%;width:{{ b.pctw }};background:var(--c);border-radius:999px\"><\/div><\/div><span style=\"width:46px;text-align:right;font-weight:700;color:var(--c)\">{{ b.pct }}%<\/span><span style=\"width:64px;text-align:right\"><sc-if value=\"{{ b.due }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--color-warning)\">Due<\/span><\/sc-if><\/span><\/div><\/sc-for><\/div><\/div>\n          <\/div>\n        <\/div>\n      <\/sc-if>\n\n    <\/div>\n  <\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = {\n    dark: false, view: 'dashboard', timerOn: true, showReasoning: false,\n    progressRange: '30d', draft: '', coachTyping: false,\n    chat: [\n      { from: 'coach', body: 'Ready when you are. Want to unpack the parallelism item, or work a fresh one? Your misses cluster on pattern-matching questions.' },\n      { from: 'user', body: 'Why was my answer wrong on the thrift-shop question?' },\n      { from: 'coach', body: 'The list sets a pattern: “pricing…, rotating…, tracking…” — three -ing phrases. Your pick swapped the last one to “to track,” which breaks the pattern even though it sounds fine alone. Match the form of the first items before judging by ear.' },\n    ],\n    // outer loop\n    session: null,\n    // inner loop (current item)\n    itemId: null, selected: null, submittedLetter: null,\n    attempts: [], rung: -1, promptCount: 0, coachTurns: [], promptDraft: '',\n    selfExplain: '', gauge: null, solved: false,\n    // mastery (drives outer loop + fading)\n    mastery: { punctuation: 49, usage: 71, rhetoric: 58, organization: 66, structure: 74, conciseness: 81 },\n  };\n\n  // ---- misconception-tag library: tags drive targeted, leakage-safe coaching ----\n  lib = {\"ti-gen-0234d28238192294:B\":{\"label\":\"Matches the verb to 'libraries,' the nearest noun, but that noun is the object of 'of,' not the subject.\",\"pump\":\"How did you decide which word in the sentence the verb should agree with?\",\"hint\":\"Strip away any prepositional phrase sitting between the opening word and the verb, then test agreement again.\",\"prompt\":\"Is 'libraries' actually the subject here, or is it just the object of the little word 'of'?\"},\"ti-gen-0234d28238192294:C\":{\"label\":\"Doubles the error: the plural helper 'are' clashes with singular 'Each,' and progressive aspect misfits a r…\",\"pump\":\"Read the sentence aloud — what did the verb's -ing form add for you?\",\"hint\":\"Run two checks: does the helper verb's number match the true subject, and does an ongoing '-ing' form suit a standing routine?\",\"prompt\":\"For a practice that holds true all the time, is an 'is/are …-ing' construction the right aspect — and does 'are' match a singular subject?\"},\"ti-gen-0234d28238192294:D\":{\"label\":\"Uses the plural helper 'have' with the singular subject and shifts a present routine into the perfect tense.\",\"pump\":\"What would change if the sentence were describing a completed past action instead of a routine?\",\"hint\":\"Check two things at the same time: the number of the helping verb and the time frame the sentence describes.\",\"prompt\":\"Does 'have' agree with a singular subject like 'each' — and does a perfect-tense form fit an ongoing routine?\"},\"ti-gen-008e6e42275f539a:A\":{\"label\":\"'Prohibit' does not take a to-infinitive;\",\"pump\":\"Before checking anything else, say the underlined phrase out loud — does it sound like standard usage to you?\",\"hint\":\"Think about which small connecting words the verb 'prohibit' normally travels with.\",\"prompt\":\"You can 'forbid someone to do' something — but does 'prohibit' follow that same pattern, or does it demand a different connector?\"},\"ti-gen-008e6e42275f539a:C\":{\"label\":\"Hypercorrects with a 'that' clause, a structure 'prohibit' does not allow (idiom_that_clause).\",\"pump\":\"Say more about why a 'that' clause seemed like the right fix here.\",\"hint\":\"Consider whether 'prohibit' can hand its action off to a full clause the way 'require' or 'insist' can.\",\"prompt\":\"Would you ever write 'The rule prohibits that we park here' in careful prose?\"},\"ti-gen-008e6e42275f539a:D\":{\"label\":\"Drops the required preposition, leaving a nonstandard shortcut (idiom_dropped_prep).\",\"pump\":\"Tell me what connects 'vendors' to 'selling' in this version.\",\"hint\":\"Check whether the verb's required linking word survived in this shortened phrasing.\",\"prompt\":\"If a sign 'prohibits visitors feeding the ducks,' is anything missing between the person and the action?\"},\"ti-gen-03b4e18d0b336929:A\":{\"label\":\"Simple past cannot show that the clearing was completed before another past event;\",\"pump\":\"What relationship do you see between the two events in this sentence — which one finished first?\",\"hint\":\"Timeline check: place the melting and the clearing on a line. The phrase 'by the time' is a signal about their order — what kind of signal?\",\"prompt\":\"If both events sit in plain past tense, can a reader tell that the clearing was finished before the snow melted?\"},\"ti-gen-03b4e18d0b336929:B\":{\"label\":\"Present perfect ties the action to the present moment, which clashes with the finished past time marker 'la…\",\"pump\":\"How did you decide on this tense — what time frame does 'last June' lock the sentence into?\",\"hint\":\"Check compatibility: some verb forms reach forward into the present moment. Ask whether this sentence ever leaves the past.\",\"prompt\":\"A form built on 'has' connects an action to right now. Can that coexist with a sentence anchored to a specific June that is over?\"},\"ti-gen-03b4e18d0b336929:D\":{\"label\":\"Future perfect points to a deadline that has not yet arrived, contradicting a sentence anchored entirely in…\",\"pump\":\"Before checking anything else, ask: is any part of this sentence happening in the future?\",\"hint\":\"Match the verb's direction to the sentence's anchors. Find every time expression and note whether it points backward or forward.\",\"prompt\":\"'Will have' projects an action forward toward a future deadline. Does a June that is already over count as a future deadline?\"},\"ti-gen-045e89834ca58dcb:B\":{\"label\":\"Switches the final item to an infinitive, breaking the gerund pattern of the first two habits.\",\"pump\":\"Before checking the options, how would you describe the pattern this list sets up?\",\"hint\":\"Run a parallelism check: name the form of the first two list items, then test the third against it.\",\"prompt\":\"The first two habits each start with an -ing verb — does a *to*-form item match that pattern?\"},\"ti-gen-045e89834ca58dcb:C\":{\"label\":\"Turns the final item into a full clause, which cannot sit in a list of gerund phrases.\",\"pump\":\"What job is the underlined portion doing inside the list after the colon?\",\"hint\":\"Compare shapes: list items should be phrases of matching form, not a mix of phrases and clauses.\",\"prompt\":\"Could you drop a whole subject-plus-verb statement into a list whose other items are verb phrases without a subject?\"},\"ti-gen-045e89834ca58dcb:D\":{\"label\":\"Swaps in a heavy noun phrase, abandoning the -ing pattern and adding clutter.\",\"pump\":\"Read the sentence aloud — where does the rhythm of the list stumble?\",\"hint\":\"Watch for nominalizations: turning an action into a 'the ___ of' noun phrase often disguises a parallelism break.\",\"prompt\":\"The other habits are expressed as direct -ing actions — does wrapping the last one in 'the ... of' keep that same shape?\"},\"ti-gen-02d1f590eca4d020:A\":{\"label\":\"goal_offtopic: touring longevity says nothing about writing for individual voices.\",\"pump\":\"What is this paragraph mostly about, in one sentence?\",\"hint\":\"A closing line should echo the paragraph's central idea; check whether your pick echoes it or drifts to a different achievement.\",\"prompt\":\"Does the paragraph ever discuss touring or outlasting rivals?\"},\"ti-gen-02d1f590eca4d020:B\":{\"label\":\"Long tenures are related trivia;\",\"pump\":\"Which sentence in the paragraph does your pick connect back to?\",\"hint\":\"Watch for closers that are merely *related* to the topic; the best one restates the actual point, not a neighboring fact.\",\"prompt\":\"Is the paragraph about how long musicians stayed, or about how their individual sounds shaped what got written?\"},\"ti-gen-02d1f590eca4d020:C\":{\"label\":\"add_new_topic: film scores and sacred concerts open a new subject instead of closing this one.\",\"pump\":\"What would a reader expect the final sentence here to wrap up?\",\"hint\":\"Endings that introduce brand-new projects reopen the essay instead of closing it; test whether your pick adds new territory.\",\"prompt\":\"Do film scores or sacred concerts appear anywhere in this paragraph's discussion?\"},\"ti-gen-018889691813266d:A\":{\"label\":\"The nonrestrictive clause needs commas on both sides;\",\"pump\":\"Try lifting the middle clause out — does the core sentence still stand on its own?\",\"hint\":\"Decide whether that clause is essential or extra, because extra information gets fenced off.\",\"prompt\":\"If the clause is bonus information, how many commas does it take to wall it off from the sentence?\"},\"ti-gen-018889691813266d:B\":{\"label\":\"This opens the clause with a comma but never closes it, so the modifier bleeds into the verb.\",\"pump\":\"Notice where your commas open and close — does the clause get both a start and a finish?\",\"hint\":\"Check that a fenced-off clause is closed on the same side of the verb where the sentence resumes.\",\"prompt\":\"If you mark where the extra clause begins, where must the matching mark go before the verb returns?\"},\"ti-gen-018889691813266d:C\":{\"label\":\"This closes the clause but never opens it, misplacing a single comma before the verb.\",\"pump\":\"Where does the extra clause actually begin in this sentence?\",\"hint\":\"Trace the start of the removable clause and confirm a mark sits right there.\",\"prompt\":\"You closed the clause before the verb, but did you signal where it opened?\"},\"ti-gen-0113496a8c005fe7:A\":{\"label\":\"Right verdict, wrong reason — the essay follows one program closely rather than cataloging every service.\",\"pump\":\"In your own words, how many different programs does the essay actually cover?\",\"hint\":\"Verify the justification against the essay: does it really catalog many services, or dwell on one?\",\"prompt\":\"Can you name a second or third outreach offering the essay discusses besides the van visits?\"},\"ti-gen-0113496a8c005fe7:C\":{\"label\":\"Budgets, funding, and negotiations never appear anywhere in the essay.\",\"pump\":\"What made you connect this essay to money matters?\",\"hint\":\"Scan the essay for its recurring subject — which nouns and actions come up in sentence after sentence?\",\"prompt\":\"Where does the essay discuss funding, costs, or negotiations at all?\"},\"ti-gen-0113496a8c005fe7:D\":{\"label\":\"The homebound readers are present from the opening sentence onward, not just at the end.\",\"pump\":\"Where in the essay do the homebound readers first show up?\",\"hint\":\"Trace the readers through the essay sentence by sentence before accepting a claim about when they appear.\",\"prompt\":\"Are the crates, the stops, and the chats not all in service of those same readers well before the closing line?\"},\"ti-gen-023e29cfc2225660:A\":{\"label\":\"Off-topic: a debate about shovel brands is equipment chatter, not an example of water being managed.\",\"pump\":\"What did the stem ask the added sentence to provide — an opinion, or an example of the work?\",\"hint\":\"Match the sentence's content to the paragraph's focus on managing water. Where does equipment preference fit within that focus?\",\"prompt\":\"A debate about shovel brands tells us how the crew feels about its tools. Does it show water being moved off the path?\"},\"ti-gen-023e29cfc2225660:B\":{\"label\":\"Wrong scope: it wanders to roads elsewhere in the forest instead of showing this crew's drainage work on th…\",\"pump\":\"Where does the sentence you chose take place — on the crew's trail, or somewhere else entirely?\",\"hint\":\"Scope check: the paragraph is about this crew's work on this path. Test whether your sentence stays inside that frame.\",\"prompt\":\"Gravel roads elsewhere in the forest may erode too, but is that an example of the work this paragraph describes?\"},\"ti-gen-023e29cfc2225660:D\":{\"label\":\"Wrong purpose: raking for photographs is an aesthetic detail;\",\"pump\":\"What would change if the added sentence described looks instead of water — would it still serve the paragraph's point?\",\"hint\":\"Read the paragraph's last sentence again and note what kind of example it sets up. Then test your sentence against that setup.\",\"prompt\":\"Raking the surface for photographs concerns appearance. Where in that sentence does any water get moved?\"},\"ti-gen-0276d7482d99c6c4:A\":{\"label\":\"Describes the calendar's staffing, which says nothing about why subscribers stay.\",\"pump\":\"What relationship does your sentence draw between the calendar and readers deciding to stick around?\",\"hint\":\"Support must touch both ends of the claim: the feature and the loyalty. Check which ends your sentence touches.\",\"prompt\":\"Steady staffing might explain the calendar's quality — but does it say anything about subscribers renewing?\"},\"ti-gen-0276d7482d99c6c4:C\":{\"label\":\"Lists renewal methods, not motives — the calendar never enters the sentence.\",\"pump\":\"Tell me what your sentence proves about why people renew, rather than how.\",\"hint\":\"Watch for near-topic traps: a sentence can mention renewal and still not support the claim about what causes it.\",\"prompt\":\"Mail, phone, or front counter — do those logistics involve the calendar at all?\"},\"ti-gen-0276d7482d99c6c4:D\":{\"label\":\"Adds calendar content but draws no link to subscriber loyalty.\",\"pump\":\"If you covered up the paragraph's claim, would your sentence still be about loyalty or just about listings?\",\"hint\":\"Distinguish detail-about-the-feature from evidence-for-the-claim. Which is your sentence?\",\"prompt\":\"Story hours enrich the calendar, but where is the subscriber in that sentence?\"},\"ti-gen-01d759ebba334377:A\":{\"label\":\"'Works with' is neutral about exertion, fitting light tasks as easily as heavy ones (goal-neutral verb).\",\"pump\":\"What is the stated goal asking this verb to accomplish?\",\"hint\":\"Test the verb you kept: does it carry any sense of muscle and strain, or is it neutral about effort?\",\"prompt\":\"Could 'works with' describe someone labeling jars just as easily as someone hoisting twenty pounds of clay?\"},\"ti-gen-01d759ebba334377:B\":{\"label\":\"'Shapes' emphasizes artistry and skill rather than the muscle the goal demands (wrong emphasis).\",\"pump\":\"What aspect of Imani's work does your verb spotlight?\",\"hint\":\"Separate artistry from effort — decide which of the two the goal explicitly asks you to emphasize.\",\"prompt\":\"Does 'shapes' tell us the clay is heavy and hard-fought, or only that it is being formed skillfully?\"},\"ti-gen-01d759ebba334377:D\":{\"label\":\"'Manages' suggests calm competence at a distance, understating physical labor (weak emphasis).\",\"pump\":\"If a friend asked what your verb adds to the sentence, what would you say?\",\"hint\":\"Some verbs whisper difficulty and others shout it; rank the options by how strongly each conveys hard physical work.\",\"prompt\":\"Does 'manages' put the reader inside the physical struggle, or merely note that Imani copes?\"},\"ti-gen-168f4667ffdca01d:A\":{\"label\":\"'Although' turns the statement into a dependent clause that never attaches to a main clause — a fragment (m…\",\"pump\":\"Read the middle statement by itself, then stop. Are you left waiting for something?\",\"hint\":\"Watch the opener: a word like this one promises a second half, so see whether the period arrives before that promise is kept.\",\"prompt\":\"'Although the sirens are tested...' — although what? Where does the sentence deliver the contrast its first word sets up?\"},\"ti-gen-168f4667ffdca01d:B\":{\"label\":\"'Being tested' supplies no finite verb, so the word group still cannot stand alone (misconception: an -ing …\",\"pump\":\"What is the main verb in the version you picked?\",\"hint\":\"Do a verb audit: a stand-alone statement needs a fully conjugated verb, not just a verb-like word.\",\"prompt\":\"Can 'the sirens being tested' carry a sentence the way 'the sirens are tested' can?\"},\"ti-gen-168f4667ffdca01d:D\":{\"label\":\"'While' subordinates the clause just as 'Although' did, leaving the fragment intact (misconception: swappin…\",\"pump\":\"What changed, structurally, between the original and the version you chose?\",\"hint\":\"Test the swap: replace one subordinating opener with another and ask whether the clause gained any independence.\",\"prompt\":\"Does 'While the sirens are tested...' complete a thought any better than the original opener did?\"},\"ti-gen-063c456b53168b9d:A\":{\"label\":\"A comma alone between two independent clauses is a comma splice.\",\"pump\":\"If you covered up everything before the comma, could the remaining words stand as a sentence — and what about the first half?\",\"hint\":\"Run a splice test: count how many complete subject-verb clauses the single comma is being asked to hold together.\",\"prompt\":\"'Demand ... has soared' and 'the national centers now schedule staff' — is a lone comma a strong enough joint for two full statements?\"},\"ti-gen-063c456b53168b9d:B\":{\"label\":\"'Consequently' is a conjunctive adverb, not a conjunction, so the clauses remain illegally spliced.\",\"pump\":\"What role did you want 'consequently' to play between the two statements?\",\"hint\":\"Check the word's category: transition adverbs comment on logic but lack the grammatical power to join clauses.\",\"prompt\":\"Is 'consequently' on the FANBOYS list of coordinating conjunctions, or is it an adverb riding between two still-unjoined sentences?\"},\"ti-gen-063c456b53168b9d:D\":{\"label\":\"Removing the comma fuses the clauses with no boundary at all.\",\"pump\":\"What happens at the spot where the first statement ends if all punctuation disappears?\",\"hint\":\"Do a boundary audit: readers need some signal separating one complete thought from the next.\",\"prompt\":\"Reading 'soared over the past decade the national centers,' can you locate the border between the two claims without help?\"},\"ti-gen-00c97e9d5b86e00f:A\":{\"label\":\"'Says a story' is not idiomatic — 'say' takes words or statements, not stories.\",\"pump\":\"Read the sentence aloud — does the verb sit naturally with its object?\",\"hint\":\"Test the verb-object pairing in a bare frame: which verbs can take 'a story' as their object?\",\"prompt\":\"You can say a word or say a prayer — can you say a story?\"},\"ti-gen-00c97e9d5b86e00f:B\":{\"label\":\"'Speaks' cannot take 'a story' as its object;\",\"pump\":\"What made this verb feel like a fit for a narrative?\",\"hint\":\"Check what this verb usually takes as its object in ordinary usage.\",\"prompt\":\"One speaks a language or speaks the truth — does one speak a story?\"},\"ti-gen-00c97e9d5b86e00f:C\":{\"label\":\"'Remarks' means to comment briefly in passing, the opposite of delivering a full narrative.\",\"pump\":\"Say more about the size of action this verb describes.\",\"hint\":\"Compare each verb's scale: a brief aside versus a full narrative delivered start to finish.\",\"prompt\":\"Can a word meaning 'to comment in passing' cover a complete story unfolding across verses?\"},\"ti-gen-02d2d036c07c5d7e:B\":{\"label\":\"'Shout-out' is social-media slang, clashing with an official report (slang intrusion).\",\"pump\":\"Which words in the sentence set its level of formality?\",\"hint\":\"Grade your phrase against the register of 'final report' — do they belong to the same world?\",\"prompt\":\"Would an official review document give anyone a 'shout-out'?\"},\"ti-gen-02d2d036c07c5d7e:C\":{\"label\":\"'Totally impressed' is conversational intensifier talk, not report language (casual intensifier).\",\"pump\":\"What would happen if a review board wrote 'totally' in its findings?\",\"hint\":\"Check each option for conversational intensifiers that official prose avoids.\",\"prompt\":\"Does 'totally impressed' sound like a formal report or a text message?\"},\"ti-gen-02d2d036c07c5d7e:D\":{\"label\":\"'Thought the world of' is a cozy idiom too informal for the context (folksy idiom).\",\"pump\":\"In your own words, what tone does 'thought the world of' carry?\",\"hint\":\"Sort the options into formal and folksy piles before judging meaning.\",\"prompt\":\"Is a warm, homey idiom the way a review board records its judgment?\"},\"ti-gen-038f8016ffed3337:A\":{\"label\":\"'Made the decision to' is a padded version of a single verb.\",\"pump\":\"Which single word inside this phrase carries the actual action?\",\"hint\":\"Run a compression test: can the phrase collapse into one verb with the same meaning?\",\"prompt\":\"Does 'made the decision to' tell the reader anything that a one-word verb wouldn't?\"},\"ti-gen-038f8016ffed3337:C\":{\"label\":\"Trades one padded phrase for another, burying the action in 'making a donation of.'\",\"pump\":\"Compare this version to the original — did it actually get leaner?\",\"hint\":\"Check both halves of the phrase for padding; fixing one end can inflate the other.\",\"prompt\":\"If the team simply gave the coats away, why wrap that act in 'making a donation of'?\"},\"ti-gen-038f8016ffed3337:D\":{\"label\":\"Expands the padding further with an empty judgment clause.\",\"pump\":\"How did you weigh the length of this option against what it adds?\",\"hint\":\"Padding alert: clauses like 'that it would be best' often assert nothing the sentence needs.\",\"prompt\":\"Does the sentence require a verdict about what 'would be best,' or just the action the team took?\"}};\n  bank = [{\"id\":\"ti-gen-0234d28238192294\",\"skill\":\"usage\",\"skillName\":\"Grammar & Usage\",\"color\":\"var(--b-usage)\",\"standard\":\"GEN2.S-GRAM\",\"standardLabel\":\"Grammar & Usage · Gen2 underlined-span item\",\"difficulty\":2,\"pre\":\"Each of the branch libraries \",\"underline\":\"keeps\",\"post\":\" a binder of local bus schedules behind its reference desk.\",\"tail\":\"\",\"stem\":\"Which choice is correct for the underlined portion?\",\"choices\":[{\"l\":\"A\",\"t\":\"NO CHANGE\",\"correct\":true},{\"l\":\"B\",\"t\":\"keep\",\"tag\":\"ti-gen-0234d28238192294:B\"},{\"l\":\"C\",\"t\":\"are keeping\",\"tag\":\"ti-gen-0234d28238192294:C\"},{\"l\":\"D\",\"t\":\"have kept\",\"tag\":\"ti-gen-0234d28238192294:D\"}],\"correctLetter\":\"A\",\"correctText\":\"keeps\",\"whyCorrect\":\"The true subject is Each, which is always singular, so the singular verb is required.\",\"rule\":\"1) Find the verb. 2) Ask 'who or what does this?' 3) Cross out prepositional phrases such as 'of the branch libraries.' 4) Match the verb to the remaining head word — each, one, and everyone are singular. 5) Re-read the sentence with the phrase removed to confirm.\",\"heuristic\":\"Find the verb. Ask 'who or what does this?'\",\"selfExplain\":\"Say the rule back in your own words — what test decided it?\",\"rationale\":{\"A\":\"Correct: the subject is the singular pronoun 'Each,' so the singular verb agrees.\",\"B\":\"Matches the verb to 'libraries,' the nearest noun, but that noun is the object of 'of,' not the subject.\",\"C\":\"Doubles the error: the plural helper 'are' clashes with singular 'Each,' and progressive aspect misfits a routine habit.\",\"D\":\"Uses the plural helper 'have' with the singular subject and shifts a present routine into the perfect tense.\"},\"misconception\":null,\"opener\":\"No pick yet, so let’s open the item itself: Find the verb. What do you notice?\"},{\"id\":\"ti-gen-008e6e42275f539a\",\"skill\":\"usage\",\"skillName\":\"Grammar & Usage\",\"color\":\"var(--b-usage)\",\"standard\":\"GEN2.S-GRAM\",\"standardLabel\":\"Grammar & Usage · Gen2 underlined-span item\",\"difficulty\":3,\"pre\":\"County health codes \",\"underline\":\"prohibit vendors to sell\",\"post\":\" samples that have sat unrefrigerated for more than two hours.\",\"tail\":\"\",\"stem\":\"Which choice conforms to the conventions of standard written English?\",\"choices\":[{\"l\":\"A\",\"t\":\"NO CHANGE\",\"tag\":\"ti-gen-008e6e42275f539a:A\"},{\"l\":\"B\",\"t\":\"prohibit vendors from selling\",\"correct\":true},{\"l\":\"C\",\"t\":\"prohibit that vendors sell\",\"tag\":\"ti-gen-008e6e42275f539a:C\"},{\"l\":\"D\",\"t\":\"prohibit vendors selling\",\"tag\":\"ti-gen-008e6e42275f539a:D\"}],\"correctLetter\":\"B\",\"correctText\":\"prohibit vendors from selling\",\"whyCorrect\":\"The verb prohibit takes the fixed pattern 'prohibit someone from doing something.'\",\"rule\":\"1) Identify the verb that controls the underlined pattern. 2) Recall its fixed companion pattern by testing a familiar example ('the sign prohibits visitors ___ feeding the ducks'). 3) Eliminate any option that borrows a different verb's pattern. 4) Eliminate any option missing the required connector. 5) Confirm the survivor reads naturally in the sentence.\",\"heuristic\":\"Identify the verb that controls the underlined pattern. Recall its fixed companion pattern by testing a familiar example ('the sign prohibits visitors ___ feeding the ducks').\",\"selfExplain\":\"Say the rule back in your own words — what test decided it?\",\"rationale\":{\"A\":\"'Prohibit' does not take a to-infinitive; this borrows the pattern of 'forbid' (idiom_wrong_pattern).\",\"B\":\"Correct — 'prohibit' idiomatically takes an object plus 'from' with an -ing form.\",\"C\":\"Hypercorrects with a 'that' clause, a structure 'prohibit' does not allow (idiom_that_clause).\",\"D\":\"Drops the required preposition, leaving a nonstandard shortcut (idiom_dropped_prep).\"},\"misconception\":null,\"opener\":\"No pick yet, so let’s open the item itself: Identify the verb that controls the underlined pattern. What do you notice?\"},{\"id\":\"ti-gen-03b4e18d0b336929\",\"skill\":\"usage\",\"skillName\":\"Grammar & Usage\",\"color\":\"var(--b-usage)\",\"standard\":\"GEN2.S-GRAM\",\"standardLabel\":\"Grammar & Usage · Gen2 underlined-span item\",\"difficulty\":5,\"pre\":\"By the time the snow finally melted off the pass last June, the crew, working upward from the trailhead, \",\"underline\":\"already cleared\",\"post\":\" two hundred downed lodgepoles from the lower switchbacks.\",\"tail\":\"\",\"stem\":\"Which choice best conforms to the conventions of standard English?\",\"choices\":[{\"l\":\"A\",\"t\":\"NO CHANGE\",\"tag\":\"ti-gen-03b4e18d0b336929:A\"},{\"l\":\"B\",\"t\":\"has already cleared\",\"tag\":\"ti-gen-03b4e18d0b336929:B\"},{\"l\":\"C\",\"t\":\"had already cleared\",\"correct\":true},{\"l\":\"D\",\"t\":\"will have already cleared\",\"tag\":\"ti-gen-03b4e18d0b336929:D\"}],\"correctLetter\":\"C\",\"correctText\":\"had already cleared\",\"whyCorrect\":\"The past perfect is required because the clearing was finished *before* another completed past event, the June snowmelt.\",\"rule\":\"1) Put every event in the sentence on a timeline. 2) Find sequencing signals like 'by the time.' 3) Mark the event completed first and give it the past perfect (had + past participle). 4) Keep the later past event in simple past. 5) Reject any form that reaches into the present or future.\",\"heuristic\":\"Put every event in the sentence on a timeline. Find sequencing signals like 'by the time.'\",\"selfExplain\":\"Say the rule back in your own words — what test decided it?\",\"rationale\":{\"A\":\"Simple past cannot show that the clearing was completed before another past event; the 'by the time' frame demands the past perfect.\",\"B\":\"Present perfect ties the action to the present moment, which clashes with the finished past time marker 'last June.'\",\"C\":\"Correct: past perfect (*had* + participle) marks the earlier of two past events, exactly what 'by the time the snow melted' requires.\",\"D\":\"Future perfect points to a deadline that has not yet arrived, contradicting a sentence anchored entirely in the past.\"},\"misconception\":null,\"opener\":\"No pick yet, so let’s open the item itself: Put every event in the sentence on a timeline. What do you notice?\"},{\"id\":\"ti-gen-045e89834ca58dcb\",\"skill\":\"usage\",\"skillName\":\"Grammar & Usage\",\"color\":\"var(--b-usage)\",\"standard\":\"GEN2.S-GRAM\",\"standardLabel\":\"Grammar & Usage · Gen2 underlined-span item\",\"difficulty\":5,\"pre\":\"The manager credits the shop's longevity to three habits: pricing donations the day they arrive, rotating window displays before shoppers tire of them, and \",\"underline\":\"tracking which sections outsell the rest\",\"post\":\".\",\"tail\":\"\",\"stem\":\"Which choice best maintains the grammatical pattern of the sentence?\",\"choices\":[{\"l\":\"A\",\"t\":\"NO CHANGE\",\"correct\":true},{\"l\":\"B\",\"t\":\"to track which sections outsell the rest\",\"tag\":\"ti-gen-045e89834ca58dcb:B\"},{\"l\":\"C\",\"t\":\"she tracks which sections outsell the rest\",\"tag\":\"ti-gen-045e89834ca58dcb:C\"},{\"l\":\"D\",\"t\":\"the tracking of which sections outsell the rest\",\"tag\":\"ti-gen-045e89834ca58dcb:D\"}],\"correctLetter\":\"A\",\"correctText\":\"tracking which sections outsell the rest\",\"whyCorrect\":\"Items in a series must share one grammatical form, and this list is built on gerund (-ing) phrases.\",\"rule\":\"1) Find the list. 2) Label the grammatical form of the first item. 3) Check that every later item wears the same form. 4) Reject any option that changes form, even if it sounds fine alone. 5) Prefer the version that keeps the pattern intact.\",\"heuristic\":\"Find the list. Label the grammatical form of the first item.\",\"selfExplain\":\"Say the rule back in your own words — what test decided it?\",\"rationale\":{\"A\":\"Correct: the third habit stays a gerund phrase, matching *pricing* and *rotating*.\",\"B\":\"Switches the final item to an infinitive, breaking the gerund pattern of the first two habits.\",\"C\":\"Turns the final item into a full clause, which cannot sit in a list of gerund phrases.\",\"D\":\"Swaps in a heavy noun phrase, abandoning the -ing pattern and adding clutter.\"},\"misconception\":null,\"opener\":\"No pick yet, so let’s open the item itself: Find the list. What do you notice?\"},{\"id\":\"ti-gen-02d1f590eca4d020\",\"skill\":\"organization\",\"skillName\":\"Organization\",\"color\":\"var(--b-org)\",\"standard\":\"GEN2.S-ORG\",\"standardLabel\":\"Organization · Gen2 rhetorical item\",\"difficulty\":4,\"pre\":\"Duke Ellington rarely wrote for an anonymous trumpet or saxophone part. He composed 'Concerto for Cootie' around Cootie Williams's growling plunger mute, and he shaped ballads to ride the liquid glide of Johnny Hodges's alto. When a musician left the band, Ellington often shelved the pieces built on that player's sound rather than reassign them.\",\"underline\":\"\",\"post\":\"\",\"tail\":\"\",\"stem\":\"The writer wants a concluding sentence that reinforces the paragraph's main idea. Which choice best accomplishes that goal?\",\"choices\":[{\"l\":\"A\",\"t\":\"Ellington's orchestra crisscrossed the country for decades, outlasting most rival bands.\",\"tag\":\"ti-gen-02d1f590eca4d020:A\"},{\"l\":\"B\",\"t\":\"Several musicians stayed in the orchestra with Ellington for twenty years or more.\",\"tag\":\"ti-gen-02d1f590eca4d020:B\"},{\"l\":\"C\",\"t\":\"Ellington also composed film scores and, later, extended sacred concerts.\",\"tag\":\"ti-gen-02d1f590eca4d020:C\"},{\"l\":\"D\",\"t\":\"The orchestra, Ellington understood, was itself the instrument he truly composed for.\",\"correct\":true}],\"correctLetter\":\"D\",\"correctText\":\"The orchestra, Ellington understood, was itself the instrument he truly composed for.\",\"whyCorrect\":\"It restates the paragraph's central idea — composing for particular players — in a single closing image.\",\"rule\":\"1) State the paragraph's main idea in one sentence. 2) Test each closer: does it restate or extend that idea? 3) Cross out any option that introduces new information or shifts topic. 4) Choose the option that could stand alone as a one-line summary of the paragraph.\",\"heuristic\":\"State the paragraph's main idea in one sentence. Test each closer: does it restate or extend that idea?\",\"selfExplain\":\"Say the rule back in your own words — what test decided it?\",\"rationale\":{\"A\":\"goal_offtopic: touring longevity says nothing about writing for individual voices.\",\"B\":\"Long tenures are related trivia; the paragraph is about how Ellington composed, not how long players stayed.\",\"C\":\"add_new_topic: film scores and sacred concerts open a new subject instead of closing this one.\",\"D\":\"Correct: it distills the paragraph's idea — the band's specific voices were the medium he wrote for.\"},\"misconception\":null,\"opener\":\"No pick yet, so let’s open the item itself: State the paragraph's main idea in one sentence. What do you notice?\"},{\"id\":\"ti-gen-018889691813266d\",\"skill\":\"punctuation\",\"skillName\":\"Punctuation\",\"color\":\"var(--b-punct)\",\"standard\":\"GEN2.S-PUNC\",\"standardLabel\":\"Punctuation · Gen2 underlined-span item\",\"difficulty\":4,\"pre\":\"\",\"underline\":\"Sea stars which can regrow lost arms are\",\"post\":\" among the most resilient hunters in the pool.\",\"tail\":\"\",\"stem\":\"Which choice correctly punctuates the sentence?\",\"choices\":[{\"l\":\"A\",\"t\":\"NO CHANGE\",\"tag\":\"ti-gen-018889691813266d:A\"},{\"l\":\"B\",\"t\":\"Sea stars, which can regrow lost arms are\",\"tag\":\"ti-gen-018889691813266d:B\"},{\"l\":\"C\",\"t\":\"Sea stars which can regrow lost arms, are\",\"tag\":\"ti-gen-018889691813266d:C\"},{\"l\":\"D\",\"t\":\"Sea stars, which can regrow lost arms, are\",\"correct\":true}],\"correctLetter\":\"D\",\"correctText\":\"Sea stars, which can regrow lost arms, are\",\"whyCorrect\":\"A nonrestrictive 'which' clause must be enclosed by a pair of commas.\",\"rule\":\"1) Find the extra-information clause. 2) Test whether the sentence still makes sense without it. 3) If yes, it is nonrestrictive and needs a comma before and after. 4) Make sure both commas are present.\",\"heuristic\":\"Find the extra-information clause. Test whether the sentence still makes sense without it.\",\"selfExplain\":\"Say the rule back in your own words — what test decided it?\",\"rationale\":{\"A\":\"The nonrestrictive clause needs commas on both sides; leaving them out runs the modifier into the sentence (missing_nonrestrictive_commas).\",\"B\":\"This opens the clause with a comma but never closes it, so the modifier bleeds into the verb.\",\"C\":\"This closes the clause but never opens it, misplacing a single comma before the verb.\",\"D\":\"Correct: paired commas set off the nonrestrictive clause 'which can regrow lost arms.'\"},\"misconception\":null,\"opener\":\"No pick yet, so let’s open the item itself: Find the extra-information clause. What do you notice?\"},{\"id\":\"ti-gen-0113496a8c005fe7\",\"skill\":\"rhetoric\",\"skillName\":\"Rhetoric\",\"color\":\"var(--b-rhetoric)\",\"standard\":\"GEN2.S-RHET\",\"standardLabel\":\"Rhetoric · Gen2 rhetorical item\",\"difficulty\":2,\"pre\":\"For eleven years, the Maple Street branch has run a delivery route for patrons who cannot travel to the building. Twice a month, a librarian loads crates of requested novels, audiobooks, and large-print mysteries into a small van. At each stop, she collects finished books, takes new requests, and often stays a few minutes to chat about what to read next. Riders who once felt cut off from the library now plan their calendars around her visits.\",\"underline\":\"\",\"post\":\"\",\"tail\":\"\",\"stem\":\"Suppose the writer's goal had been to show how one public library serves patrons who cannot visit in person. Would this essay accomplish that goal?\",\"choices\":[{\"l\":\"A\",\"t\":\"Yes, because it lists every outreach service the library system offers.\",\"tag\":\"ti-gen-0113496a8c005fe7:A\"},{\"l\":\"B\",\"t\":\"Yes, because it describes the branch's delivery route and its effect on the patrons it reaches.\",\"correct\":true},{\"l\":\"C\",\"t\":\"No, because it centers on the library's annual budget negotiations.\",\"tag\":\"ti-gen-0113496a8c005fe7:C\"},{\"l\":\"D\",\"t\":\"No, because it mentions patrons only in its final sentence.\",\"tag\":\"ti-gen-0113496a8c005fe7:D\"}],\"correctLetter\":\"B\",\"correctText\":\"Yes, because it describes the branch's delivery route and its effect on the patrons it reaches.\",\"whyCorrect\":\"The essay's every sentence develops one program for homebound readers, which is precisely what the supposed goal requires.\",\"rule\":\"1) Restate the supposed goal in your own words. 2) Summarize what the essay actually spends its sentences on. 3) Decide yes or no by comparing the two. 4) Then verify the chosen reason is factually true of the essay. 5) Eliminate any option whose reason misstates the essay, even when its verdict matches yours.\",\"heuristic\":\"Restate the supposed goal in your own words. Summarize what the essay actually spends its sentences on.\",\"selfExplain\":\"Say the rule back in your own words — what test decided it?\",\"rationale\":{\"A\":\"Right verdict, wrong reason — the essay follows one program closely rather than cataloging every service.\",\"B\":\"Correct: the essay details exactly how one branch brings books to homebound readers and how those readers respond.\",\"C\":\"Budgets, funding, and negotiations never appear anywhere in the essay.\",\"D\":\"The homebound readers are present from the opening sentence onward, not just at the end.\"},\"misconception\":null,\"opener\":\"No pick yet, so let’s open the item itself: Restate the supposed goal in your own words. What do you notice?\"},{\"id\":\"ti-gen-023e29cfc2225660\",\"skill\":\"rhetoric\",\"skillName\":\"Rhetoric\",\"color\":\"var(--b-rhetoric)\",\"standard\":\"GEN2.S-RHET\",\"standardLabel\":\"Rhetoric · Gen2 rhetorical item\",\"difficulty\":2,\"pre\":\"The crew's real enemy on the mountain is not rock but water. Left alone, runoff follows the packed path downhill, picking up speed and soil with every yard. Most of the season is therefore spent on drainage, and the crew builds features designed to push water off the path before it can dig in.\",\"underline\":\"\",\"post\":\"\",\"tail\":\"\",\"stem\":\"The writer wants to add a sentence that gives a specific example of the drainage work described in the paragraph. Which choice best accomplishes that goal?\",\"choices\":[{\"l\":\"A\",\"t\":\"Crew members often debate which brand of shovel stands up best to rocky soil.\",\"tag\":\"ti-gen-023e29cfc2225660:A\"},{\"l\":\"B\",\"t\":\"Runoff is also a problem on gravel roads throughout the national forest.\",\"tag\":\"ti-gen-023e29cfc2225660:B\"},{\"l\":\"C\",\"t\":\"Every fifty feet of steep grade, the crew carves a shallow channel across the tread to shed runoff.\",\"correct\":true},{\"l\":\"D\",\"t\":\"The tread is raked smooth at the end of each season so the trail photographs well.\",\"tag\":\"ti-gen-023e29cfc2225660:D\"}],\"correctLetter\":\"C\",\"correctText\":\"Every fifty feet of steep grade, the crew carves a shallow channel across the tread to shed runoff.\",\"whyCorrect\":\"The paragraph's focus is moving water off the path, and only this sentence gives a specific instance of the crew doing exactly that.\",\"rule\":\"1) State the paragraph's focus in one phrase. 2) State the stem's goal. 3) Test each candidate: does it give a specific instance of that focus, in the right place, by the right people? 4) Reject details that are off-topic, out of scope, or serving a different purpose.\",\"heuristic\":\"State the paragraph's focus in one phrase. State the stem's goal.\",\"selfExplain\":\"Say the rule back in your own words — what test decided it?\",\"rationale\":{\"A\":\"Off-topic: a debate about shovel brands is equipment chatter, not an example of water being managed.\",\"B\":\"Wrong scope: it wanders to roads elsewhere in the forest instead of showing this crew's drainage work on the trail.\",\"C\":\"Correct: it names a specific, concrete drainage feature the crew builds, directly illustrating the paragraph's focus.\",\"D\":\"Wrong purpose: raking for photographs is an aesthetic detail; no water is being controlled.\"},\"misconception\":null,\"opener\":\"No pick yet, so let’s open the item itself: State the paragraph's focus in one phrase. What do you notice?\"},{\"id\":\"ti-gen-0276d7482d99c6c4\",\"skill\":\"rhetoric\",\"skillName\":\"Rhetoric\",\"color\":\"var(--b-rhetoric)\",\"standard\":\"GEN2.S-RHET\",\"standardLabel\":\"Rhetoric · Gen2 rhetorical item\",\"difficulty\":3,\"pre\":\"Loyal readers often say they subscribe to the Sentinel mainly for its community calendar. The calendar lists every gathering in the county, from pancake breakfasts to school-board meetings, and it appears in the same spot on page three each week.\",\"underline\":\"\",\"post\":\"\",\"tail\":\"\",\"stem\":\"The writer wants to add a sentence that most strongly supports the paragraph's claim that the calendar keeps subscribers loyal. Which choice best accomplishes that goal?\",\"choices\":[{\"l\":\"A\",\"t\":\"The Sentinel's calendar has been edited by the same staff member for eleven years.\",\"tag\":\"ti-gen-0276d7482d99c6c4:A\"},{\"l\":\"B\",\"t\":\"In a recent survey, half of the Sentinel's subscribers named the calendar as the top reason they renew.\",\"correct\":true},{\"l\":\"C\",\"t\":\"Subscribers can renew by mail, by phone, or at the newspaper's front counter.\",\"tag\":\"ti-gen-0276d7482d99c6c4:C\"},{\"l\":\"D\",\"t\":\"One recent addition to the calendar is a listing of library story hours.\",\"tag\":\"ti-gen-0276d7482d99c6c4:D\"}],\"correctLetter\":\"B\",\"correctText\":\"In a recent survey, half of the Sentinel's subscribers named the calendar as the top reason they renew.\",\"whyCorrect\":\"It is the only option that links both ends of the claim — the calendar and subscribers' decisions to stay.\",\"rule\":\"1) Underline the claim to be supported ('the calendar keeps subscribers loyal'). 2) For each option, ask: does it connect the calendar to subscribers' staying? 3) Discard sentences about the calendar alone or about subscribing alone. 4) Prefer concrete evidence of the link over adjacent facts. 5) Re-read the paragraph with the winner inserted a. 4) Eliminate verbs that emphasize a different quality. 5) Keep the verb whose core meaning is the goal itself.\",\"heuristic\":\"Restate the writer's goal in one word (here: effort). Ask of each verb: what does it emphasize?\",\"selfExplain\":\"Say the rule back in your own words — what test decided it?\",\"rationale\":{\"A\":\"'Works with' is neutral about exertion, fitting light tasks as easily as heavy ones (goal-neutral verb).\",\"B\":\"'Shapes' emphasizes artistry and skill rather than the muscle the goal demands (wrong emphasis).\",\"C\":\"Correct: 'wrestles' turns the clay into a physical opponent, foregrounding strenuous bodily effort.\",\"D\":\"'Manages' suggests calm competence at a distance, understating physical labor (weak emphasis).\"},\"misconception\":null,\"opener\":\"No pick yet, so let’s open the item itself: Restate the writer's goal in one word (here: effort). What do you notice?\"},{\"id\":\"ti-gen-168f4667ffdca01d\",\"skill\":\"structure\",\"skillName\":\"Sentence Structure\",\"color\":\"var(--b-struct)\",\"standard\":\"GEN2.S-SENT\",\"standardLabel\":\"Sentence Structure · Gen2 underlined-span item\",\"difficulty\":1,\"pre\":\"The county's tornado sirens date from the 1950s. \",\"underline\":\"Although the sirens are tested on the first Wednesday of every month.\",\"post\":\" Few residents have ever heard them in a real emergency.\",\"tail\":\"\",\"stem\":\"Which choice results in a complete sentence?\",\"choices\":[{\"l\":\"A\",\"t\":\"NO CHANGE\",\"tag\":\"ti-gen-168f4667ffdca01d:A\"},{\"l\":\"B\",\"t\":\"Although the sirens being tested on the first Wednesday of every month.\",\"tag\":\"ti-gen-168f4667ffdca01d:B\"},{\"l\":\"C\",\"t\":\"The sirens are tested on the first Wednesday of every month.\",\"correct\":true},{\"l\":\"D\",\"t\":\"While the sirens are tested on the first Wednesday of every month.\",\"tag\":\"ti-gen-168f4667ffdca01d:D\"}],\"correctLetter\":\"C\",\"correctText\":\"The sirens are tested on the first Wednesday of every month.\",\"whyCorrect\":\"Deleting the subordinating word lets the clause stand alone as a complete sentence.\",\"rule\":\"1) Read the word group alone. 2) Find a subject and a finite verb. 3) Check the first word: does it make the clause lean on another sentence ('although,' 'while,' 'because')? 4) If it leans and nothing follows, delete the leaning word or attach the clause. 5) Re-read to confirm it stands alone.\",\"heuristic\":\"Read the word group alone. Find a subject and a finite verb.\",\"selfExplain\":\"Say the rule back in your own words — what test decided it?\",\"rationale\":{\"A\":\"'Although' turns the statement into a dependent clause that never attaches to a main clause — a fragment (misconception: length plus a period equals a sentence).\",\"B\":\"'Being tested' supplies no finite verb, so the word group still cannot stand alone (misconception: an -ing form works as a main verb).\",\"C\":\"Correct: removing the subordinator leaves a complete statement with a subject and a finite verb.\",\"D\":\"'While' subordinates the clause just as 'Although' did, leaving the fragment intact (misconception: swapping subordinators fixes the structure).\"},\"misconception\":null,\"opener\":\"No pick yet, so let’s open the item itself: Read the word group alone. What do you notice?\"},{\"id\":\"ti-gen-063c456b53168b9d\",\"skill\":\"structure\",\"skillName\":\"Sentence Structure\",\"color\":\"var(--b-struct)\",\"standard\":\"GEN2.S-SENT\",\"standardLabel\":\"Sentence Structure · Gen2 underlined-span item\",\"difficulty\":4,\"pre\":\"Demand for video relay interpreting has soared over the past decade\",\"underline\":\", the\",\"post\":\" national centers now schedule staff in overlapping around-the-clock shifts.\",\"tail\":\"\",\"stem\":\"Which choice makes the sentence most grammatically acceptable?\",\"choices\":[{\"l\":\"A\",\"t\":\"NO CHANGE\",\"tag\":\"ti-gen-063c456b53168b9d:A\"},{\"l\":\"B\",\"t\":\", consequently the\",\"tag\":\"ti-gen-063c456b53168b9d:B\"},{\"l\":\"C\",\"t\":\". The\",\"correct\":true},{\"l\":\"D\",\"t\":\"the\",\"tag\":\"ti-gen-063c456b53168b9d:D\"}],\"correctLetter\":\"C\",\"correctText\":\". The\",\"whyCorrect\":\"Two independent clauses can be separated by a period; a bare comma or no mark at all cannot join them.\",\"rule\":\"1) Test each side of the underlined punctuation as its own sentence. 2) If both pass, a bare comma is a splice. 3) List legal fixes: period, semicolon, or comma plus a FANBOYS word. 4) Match the options against the legal list and eliminate everything else.\",\"heuristic\":\"Test each side of the underlined punctuation as its own sentence. If both pass, a bare comma is a splice.\",\"selfExplain\":\"Say the rule back in your own words — what test decided it?\",\"rationale\":{\"A\":\"A comma alone between two independent clauses is a comma splice.\",\"B\":\"'Consequently' is a conjunctive adverb, not a conjunction, so the clauses remain illegally spliced.\",\"C\":\"Correct — a period cleanly separates the two independent clauses into two sentences.\",\"D\":\"Removing the comma fuses the clauses with no boundary at all.\"},\"misconception\":null,\"opener\":\"No pick yet, so let’s open the item itself: Test each side of the underlined punctuation as its own sentence. What do you notice?\"},{\"id\":\"ti-gen-00c97e9d5b86e00f\",\"skill\":\"conciseness\",\"skillName\":\"Style\",\"color\":\"var(--b-concise)\",\"standard\":\"GEN2.S-STYLE\",\"standardLabel\":\"Style · Gen2 underlined-span item\",\"difficulty\":2,\"pre\":\"A good ballad \",\"underline\":\"says\",\"post\":\" a complete story in only a handful of verses.\",\"tail\":\"\",\"stem\":\"Which word most precisely fits the context?\",\"choices\":[{\"l\":\"A\",\"t\":\"NO CHANGE\",\"tag\":\"ti-gen-00c97e9d5b86e00f:A\"},{\"l\":\"B\",\"t\":\"speaks\",\"tag\":\"ti-gen-00c97e9d5b86e00f:B\"},{\"l\":\"C\",\"t\":\"remarks\",\"tag\":\"ti-gen-00c97e9d5b86e00f:C\"},{\"l\":\"D\",\"t\":\"tells\",\"correct\":true}],\"correctLetter\":\"D\",\"correctText\":\"tells\",\"whyCorrect\":\"Precision here is about collocation — the verb that English pairs with 'a story' as its object.\",\"rule\":\"1) Find the verb's object ('a story'). 2) Ask which verbs naturally take that object in everyday English. 3) Test each option in the frame 'to ___ a story.' 4) Reject any verb that breaks the pairing or changes the scale of the action. 5) Choose the verb that fits the object exactly.\",\"heuristic\":\"Find the verb's object ('a story'). Ask which verbs naturally take that object in everyday English.\",\"selfExplain\":\"Say the rule back in your own words — what test decided it?\",\"rationale\":{\"A\":\"'Says a story' is not idiomatic — 'say' takes words or statements, not stories.\",\"B\":\"'Speaks' cannot take 'a story' as its object; one speaks a language, not a story.\",\"C\":\"'Remarks' means to comment briefly in passing, the opposite of delivering a full narrative.\",\"D\":\"Correct: stories are told; the verb pairs precisely with the object.\"},\"misconception\":null,\"opener\":\"No pick yet, so let’s open the item itself: Find the verb's object ('a story'). What do you notice?\"},{\"id\":\"ti-gen-02d2d036c07c5d7e\",\"skill\":\"conciseness\",\"skillName\":\"Style\",\"color\":\"var(--b-concise)\",\"standard\":\"GEN2.S-STYLE\",\"standardLabel\":\"Style · Gen2 underlined-span item\",\"difficulty\":2,\"pre\":\"In its final report, the review board \",\"underline\":\"commended\",\"post\":\" the team for its meticulous record keeping.\",\"tail\":\"\",\"stem\":\"Which choice best maintains the formal style of the sentence?\",\"choices\":[{\"l\":\"A\",\"t\":\"NO CHANGE\",\"correct\":true},{\"l\":\"B\",\"t\":\"gave a shout-out to\",\"tag\":\"ti-gen-02d2d036c07c5d7e:B\"},{\"l\":\"C\",\"t\":\"was totally impressed with\",\"tag\":\"ti-gen-02d2d036c07c5d7e:C\"},{\"l\":\"D\",\"t\":\"thought the world of\",\"tag\":\"ti-gen-02d2d036c07c5d7e:D\"}],\"correctLetter\":\"A\",\"correctText\":\"commended\",\"whyCorrect\":\"The original verb already matches the sentence's formal register, so it should stand.\",\"rule\":\"1) Identify the context clues for register ('final report,' 'review board'). 2) Label the required register: formal. 3) Grade each option against that label. 4) If the original already matches, keep it; revise only what is broken.\",\"heuristic\":\"Identify the context clues for register ('final report,' 'review board'). Label the required register: formal.\",\"selfExplain\":\"Say the rule back in your own words — what test decided it?\",\"rationale\":{\"A\":\"'Commended' matches the formal register of 'final report' and 'review board.'\",\"B\":\"'Shout-out' is social-media slang, clashing with an official report (slang intrusion).\",\"C\":\"'Totally impressed' is conversational intensifier talk, not report language (casual intensifier).\",\"D\":\"'Thought the world of' is a cozy idiom too informal for the context (folksy idiom).\"},\"misconception\":null,\"opener\":\"No pick yet, so let’s open the item itself: Identify the context clues for register ('final report,' 'review board'). What do you notice?\"},{\"id\":\"ti-gen-038f8016ffed3337\",\"skill\":\"conciseness\",\"skillName\":\"Style\",\"color\":\"var(--b-concise)\",\"standard\":\"GEN2.S-STYLE\",\"standardLabel\":\"Style · Gen2 underlined-span item\",\"difficulty\":2,\"pre\":\"Last February, the sorting team \",\"underline\":\"made the decision to donate\",\"post\":\" unsold coats to a nearby shelter.\",\"tail\":\"\",\"stem\":\"Which choice expresses the idea most concisely?\",\"choices\":[{\"l\":\"A\",\"t\":\"NO CHANGE\",\"tag\":\"ti-gen-038f8016ffed3337:A\"},{\"l\":\"B\",\"t\":\"decided to donate\",\"correct\":true},{\"l\":\"C\",\"t\":\"decided on making a donation of\",\"tag\":\"ti-gen-038f8016ffed3337:C\"},{\"l\":\"D\",\"t\":\"came to the decision that it would be best to donate\",\"tag\":\"ti-gen-038f8016ffed3337:D\"}],\"correctLetter\":\"B\",\"correctText\":\"decided to donate\",\"whyCorrect\":\"When a phrase can shrink to a single verb with no loss of meaning, the shorter version is correct.\",\"rule\":\"1) Find the action hiding inside the noun phrase. 2) Replace the phrase with that verb. 3) Compare meanings — if identical, keep the verb. 4) Scan the shorter option for leftover padding. 5) Confirm grammar still works in context.\",\"heuristic\":\"Find the action hiding inside the noun phrase. Replace the phrase with that verb.\",\"selfExplain\":\"Say the rule back in your own words — what test decided it?\",\"rationale\":{\"A\":\"'Made the decision to' is a padded version of a single verb.\",\"B\":\"Correct: one verb delivers the entire meaning without padding.\",\"C\":\"Trades one padded phrase for another, burying the action in 'making a donation of.'\",\"D\":\"Expands the padding further with an empty judgment clause.\"},\"misconception\":null,\"opener\":\"No pick yet, so let’s open the item itself: Find the action hiding inside the noun phrase. What do you notice?\"}];\n\n  // ================= ENGINE =================\n  itemById(id) { return this.bank.find(i => i.id === id); }\n  current() { return this.itemById(this.state.itemId) || this.bank[0]; }\n  choiceOf(item, l) { return item.choices.find(c => c.l === l); }\n\n  classify(item, l) {\n    const ch = this.choiceOf(item, l);\n    if (!ch) return { correct: false, unknown: true };\n    if (ch.correct) return { correct: true, choice: ch };\n    const misc = this.lib[ch.tag] || {};\n    return { correct: false, choice: ch, tag: ch.tag, misc, label: misc.label };\n  }\n\n  fill(s, item, l) { return (s || '').split('{underline}').join(item.underline).split('{choice}').join(l); }\n\n  moveName(rung) { return ['pump', 'hint', 'prompt'][Math.max(0, Math.min(2, rung))]; }\n  moveTitle(m) { return { pump: 'Pump', hint: 'Hint', prompt: 'Prompt', assertion: 'Assertion' }[m]; }\n  moveWhy(m) { return {\n    pump: 'Ask a question first — the learner does the thinking.',\n    hint: 'Point at the relevant feature — still no answer.',\n    prompt: 'Fill-in-the-blank on the key idea — still no answer.',\n    assertion: 'States the step/answer — fires only after the ladder is exhausted.' }[m]; }\n\n  // does a coaching line leak the answer letter or the correct text?\n  leaks(item, text) {\n    const t = (text || '').toLowerCase();\n    const ct = (item.correctText || '').toLowerCase().replace(/[.,;]/g, '').trim();\n    const letterHit = new RegExp('\\\\b' + item.correctLetter.toLowerCase() + '\\\\b').test(t) && /answer|choice|option|correct/.test(t);\n    const un = (item.underline || '').toLowerCase().replace(/[.,;]/g, '').trim();\n    const scan = un ? t.split(un).join(' ') : t;\n    const textHit = ct.length > 6 && scan.includes(ct);\n    return letterHit || textHit;\n  }\n\n  composeTurn(item, l, rung) {\n    const cls = this.classify(item, l);\n    const move = this.moveName(rung);\n    const m = cls.misc || {};\n    let body = this.fill(m[move], item, l);\n    if (!body) body = 'What made you pick ' + l + '? Re-read the sentence with the underlined part in focus.';\n    const reason = [\n      { k: 'Moment', v: 'Wrong pick ' + l + ' \\u2192 this choice\\u2019s own 3-rung ladder (Gen2, choice-keyed)' },\n      { k: 'Classify', v: (item.rationale && item.rationale[l]) ? item.rationale[l] : (cls.label || 'off-target') },\n      { k: 'Select', v: this.moveTitle(move) + ' \\u00b7 rung ' + (rung + 1) + ' of 3 \\u2014 ' + this.moveWhy(move) },\n      { k: 'Leakage', v: this.leaks(item, body) ? '\\u26a0 would leak \\u2014 regenerate' : '\\u2713 checked \\u2014 doesn\\u2019t name or restate the answer' },\n    ];\n    return { move, body, leak: false, cls, reason };\n  }\n\n  // ================= OUTER LOOP =================\n  buildSession() {\n    // weakest + most-due first, then interleave a stronger skill for discrimination\n    // weakest+due first, interleave skills so consecutive items differ, space repeats, easy wins late\n    const order = this.bank.map(i => i.id);\n    return { queue: order, pos: 0, results: [], startMastery: { ...this.state.mastery }, focus: 'usage' };\n  }\n  whyNext(item, pos) {\n    const sess = this.state.session;\n    if (!sess || pos === 0) return 'Opening in ' + item.skillName + ' at difficulty ' + item.difficulty + ' — the first of 15 reviewed items.';\n    const prev = this.itemById(sess.queue[pos - 1]);\n    if (prev && prev.skill !== item.skill) return 'Interleaved after ' + prev.skillName + ' — you have to identify which rule applies, not just repeat the last one.';\n    return 'Spaced return to ' + item.skillName + ' at difficulty ' + item.difficulty + ' — distributed across the session, not massed.';\n  }\n\n  // ================= HANDLERS =================\n  go = (view) => () => this.setState({ view });\n  toggleTheme = () => this.setState(s => ({ dark: !s.dark }));\n  toggleTimer = () => this.setState(s => ({ timerOn: !s.timerOn }));\n  toggleReasoning = () => this.setState(s => ({ showReasoning: !s.showReasoning }));\n  setRange = (r) => () => this.setState({ progressRange: r });\n\n  loadItem(id) {\n    this.setState({ itemId: id, selected: null, submittedLetter: null, attempts: [], rung: -1, promptCount: 0, coachTurns: [{ intro: true }], promptDraft: '', selfExplain: '', gauge: null, solved: false, exhausted: false });\n  }\n  startSession = () => { const session = this.buildSession(); this.setState({ session, view: 'quiz' }); this.loadItem(session.queue[0]); };\n\n  pick = (l) => () => { if (this.state.solved) return; this.setState({ selected: l }); };\n\n  pushTurn(entry) { this.setState(s => ({ coachTurns: [...s.coachTurns.filter(t => !t.intro || s.coachTurns.length === 1 ? true : !t.intro), entry] })); }\n\n  submitAnswer = () => {\n    const { selected } = this.state; if (!selected) return;\n    const item = this.current();\n    const cls = this.classify(item, selected);\n    const attempts = [...this.state.attempts, selected];\n    if (cls.correct) {\n      const turn = { who: 'coach', move: 'verify', body: 'Yes \\u2014 that\\u2019s it. ' + item.whyCorrect, tone: 'pos',\n        reason: [{ k: 'Moment', v: 'correct \\u2192 confirm + why-correct (no ladder fires)' }, { k: 'Source', v: 'Gen2 authored why-correct explanation' }, { k: 'Select', v: 'Confirmation, then consolidation on the breakdown screen' }] };\n      this.setState(s => ({ submittedLetter: selected, attempts, solved: true, exhausted: false, coachTurns: [{ youPicked: selected }, turn] }));\n    } else {\n      const prevWrong = this.state.attempts.filter(a => a !== item.correctLetter).slice(-1)[0];\n      const turn = this.composeTurn(item, selected, 0);\n      if (prevWrong && prevWrong !== selected) turn.reason.unshift({ k: 'Re-resolve', v: 'Switched ' + prevWrong + ' \\u2192 ' + selected + ' \\u2014 restarting that choice\\u2019s ladder at rung 1' });\n      this.setState(s => ({ submittedLetter: selected, attempts, rung: 0, exhausted: false,\n        coachTurns: [{ youPicked: selected }, { who: 'coach', move: 'verify', body: 'Not quite \\u2014 and it\\u2019s a telling miss. You use this rule fine when nothing interrupts the sentence; this one interrupts on purpose. So \\u2014', tone: 'neg' }, { who: 'coach', ...turn }] }));\n    }\n  };\n\n  tryAgain = () => this.setState({ selected: null, submittedLetter: null });\n\n  askNudge = () => {\n    const item = this.current();\n    this.setState(s => ({ coachTurns: [...s.coachTurns, { who: 'you', body: 'Can I get a nudge before I pick?' }, { who: 'coach', move: 'opener', body: 'Before you pick: you\\u2019ve read sentences like this before \\u2014 so read this one fresh. What job is the underlined part doing here?', placeholder: true,\n      reason: [{ k: 'Moment', v: 'no-pick \\u2192 item-level opener (synthesized)' }, { k: 'Source', v: 'Not authored \\u2014 Gen2 has no item-level ladders yet; synthesized placeholder' }, { k: 'Counter', v: '1 of 1 \\u2014 single synthesized rung, not a Gen2 ladder' }, { k: 'Leakage', v: '\\u2713 misconception-neutral, no answer
