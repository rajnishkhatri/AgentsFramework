<!-- @dsCard group="Overlays" name="Tooltip" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Tooltip — AgentsFramework UI</title><link rel="stylesheet" href="../styles.css"></head>
<body><div class="ds-preview">
  <div class="ds-label">Tooltip · Overlays · desktop-only (@media hover:hover)</div>
  <div class="ds-section"><div class="ds-label">Placements</div>
    <div class="ds-row" style="align-items:flex-start;gap:32px;flex-wrap:wrap">
      <div class="ds-col" style="align-items:center;gap:8px">
        <div class="tooltip-content">Copy message</div>
        <div style="width:1px;height:8px;background:var(--color-border)"></div>
        <button class="btn btn-outline btn-sm">Trigger (top)</button>
      </div>
      <div class="ds-col" style="align-items:flex-start;gap:8px">
        <button class="btn btn-outline btn-sm">Trigger (right)</button>
        <div style="display:flex;align-items:center;gap:4px">
          <div style="width:8px;height:1px;background:var(--color-border)"></div>
          <div class="tooltip-content">Regenerate response</div>
        </div>
      </div>
    </div>
  </div>
  <div class="ds-section"><div class="ds-label">Icon button usage</div>
    <div class="ds-row" style="align-items:flex-start;gap:24px">
      <div class="ds-col" style="align-items:center;gap:6px">
        <div class="tooltip-content">Copy</div>
        <button class="btn btn-ghost btn-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="8" height="10" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="6" y="4" width="8" height="10" rx="1" stroke="currentColor" stroke-width="1.5"/></svg></button>
      </div>
      <div class="ds-col" style="align-items:center;gap:6px">
        <div class="tooltip-content">Regenerate</div>
        <button class="btn btn-ghost btn-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8A6 6 0 1 1 8 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M2 12V8h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </div>
  <div class="ds-section"><div class="ds-label">Dark mode</div>
    <div data-theme="dark" style="background:var(--color-bg);padding:16px;border-radius:var(--radius-lg)">
      <div class="ds-col" style="align-items:flex-start;gap:8px">
        <div class="tooltip-content">Copy message</div>
        <button class="btn btn-ghost btn-sm">Hover target</button>
      </div>
    </div>
  </div>
</div></body></html>
