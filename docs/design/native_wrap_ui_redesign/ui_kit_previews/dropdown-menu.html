<!-- @dsCard group="Overlays" name="DropdownMenu" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>DropdownMenu — AgentsFramework UI</title><link rel="stylesheet" href="../../_ds_bundle/styles.css"></head>
<body><div class="ds-preview">
  <div class="ds-label">DropdownMenu · Overlays · per-message actions (desktop)</div>
  <div class="ds-section"><div class="ds-label">Open state</div>
    <div style="display:flex;gap:24px;align-items:flex-start">
      <div class="ds-col"><button class="btn btn-ghost btn-sm" style="opacity:.5">···</button><div style="font-size:11px;color:var(--color-muted)">trigger</div></div>
      <div class="dropdown-content">
        <button class="dropdown-item">Copy message</button>
        <button class="dropdown-item">Regenerate</button>
        <button class="dropdown-item">Edit</button>
        <div class="dropdown-sep"></div>
        <button class="dropdown-item" style="color:var(--color-muted)">Report issue</button>
      </div>
    </div>
  </div>
  <div class="ds-section"><div class="ds-label">Dark mode</div>
    <div data-theme="dark" style="background:var(--color-bg);padding:16px;border-radius:var(--radius-lg)">
      <div class="dropdown-content">
        <button class="dropdown-item">Copy message</button>
        <button class="dropdown-item">Regenerate</button>
        <div class="dropdown-sep"></div>
        <button class="dropdown-item">Report issue</button>
      </div>
    </div>
  </div>
</div></body></html>
