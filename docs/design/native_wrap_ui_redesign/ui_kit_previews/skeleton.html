<!-- @dsCard group="Surfaces" name="Skeleton" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Skeleton — AgentsFramework UI</title><link rel="stylesheet" href="../../_ds_bundle/styles.css"></head>
<body><div class="ds-preview">
  <div class="ds-label">Skeleton · Surfaces · streaming / loading states §6</div>
  <div class="ds-section"><div class="ds-label">Text lines</div>
    <div style="display:flex;flex-direction:column;gap:8px;max-width:360px">
      <div class="skeleton" style="height:16px;width:90%"></div>
      <div class="skeleton" style="height:16px;width:75%"></div>
      <div class="skeleton" style="height:16px;width:55%"></div>
    </div>
  </div>
  <div class="ds-section"><div class="ds-label">Message bubble placeholder</div>
    <div style="display:flex;gap:12px;max-width:360px">
      <div class="skeleton" style="width:32px;height:32px;border-radius:50%;flex-shrink:0"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <div class="skeleton" style="height:14px;width:60%"></div>
        <div class="skeleton" style="height:14px;width:90%"></div>
        <div class="skeleton" style="height:14px;width:70%"></div>
      </div>
    </div>
  </div>
  <div class="ds-section"><div class="ds-label">Card placeholder</div>
    <div class="card" style="max-width:360px">
      <div class="card-header">
        <div class="skeleton" style="height:16px;width:40%;margin-bottom:4px"></div>
        <div class="skeleton" style="height:12px;width:65%"></div>
      </div>
      <div class="card-content"><div class="skeleton" style="height:64px;width:100%;border-radius:var(--radius-md)"></div></div>
    </div>
  </div>
  <div class="ds-section"><div class="ds-label">Dark mode</div>
    <div data-theme="dark" style="background:var(--color-bg);padding:16px;border-radius:var(--radius-lg)">
      <div style="display:flex;flex-direction:column;gap:8px;max-width:360px">
        <div class="skeleton" style="height:16px;width:90%"></div>
        <div class="skeleton" style="height:16px;width:75%"></div>
        <div class="skeleton" style="height:16px;width:55%"></div>
      </div>
    </div>
  </div>
</div></body></html>
