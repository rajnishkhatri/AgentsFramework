<!-- @dsCard group="Feedback" name="Toast" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Toast — AgentsFramework UI</title><link rel="stylesheet" href="../../_ds_bundle/styles.css"></head>
<body><div class="ds-preview">
  <div class="ds-label">Toast · Feedback · errors, cancel, run-complete §6</div>
  <div class="ds-section"><div class="ds-label">Variants</div>
    <div class="ds-col" style="max-width:380px">
      <div class="toast toast-success"><div class="toast-title">Run complete</div><div class="toast-desc">Planning stress · 22/22 passed · 0 regressions</div></div>
      <div class="toast"><div class="toast-title">Memory stored</div><div class="toast-desc">3 facts captured from this session</div><div class="toast-actions"><button class="toast-action">View</button><button class="toast-cancel">Dismiss</button></div></div>
      <div class="toast toast-error"><div class="toast-title">Error</div><div class="toast-desc">Backend connection lost — retrying in 5s</div><div class="toast-actions"><button class="toast-action">Retry now</button><button class="toast-cancel">Cancel</button></div></div>
    </div>
  </div>
  <div class="ds-section"><div class="ds-label">Dark mode</div>
    <div data-theme="dark" style="background:var(--color-bg);padding:16px;border-radius:var(--radius-lg)">
      <div class="toast toast-success"><div class="toast-title">Run complete</div><div class="toast-desc">22/22 passed · 0 regressions</div><div class="toast-actions"><button class="toast-action">View</button><button class="toast-cancel">Dismiss</button></div></div>
    </div>
  </div>
</div></body></html>
