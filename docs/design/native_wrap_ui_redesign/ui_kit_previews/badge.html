<!-- @dsCard group="Actions" name="Badge" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Badge — AgentsFramework UI</title><link rel="stylesheet" href="../../_ds_bundle/styles.css"></head>
<body><div class="ds-preview">
  <div class="ds-label">Badge · Actions · status chips, eval labels</div>
  <div class="ds-section"><div class="ds-label">Variants</div>
    <div class="ds-row">
      <span class="badge badge-default">Default</span>
      <span class="badge badge-accent">Accent</span>
      <span class="badge badge-outline">Outline</span>
      <span class="badge badge-success">Success</span>
      <span class="badge badge-danger">Danger</span>
      <span class="badge badge-warning">Warning</span>
    </div>
  </div>
  <div class="ds-section"><div class="ds-label">Status chips</div>
    <div class="ds-row">
      <span class="badge badge-accent">● Running</span>
      <span class="badge badge-default">Queued</span>
      <span class="badge badge-success">Complete</span>
      <span class="badge badge-warning">Retrying</span>
      <span class="badge badge-danger">P0</span>
    </div>
  </div>
  <div class="ds-section"><div class="ds-label">Dark mode</div>
    <div class="ds-row" data-theme="dark" style="background:var(--color-bg);padding:16px;border-radius:var(--radius-lg)">
      <span class="badge badge-accent">● Running</span>
      <span class="badge badge-default">Queued</span>
      <span class="badge badge-success">Complete</span>
      <span class="badge badge-warning">Retrying</span>
      <span class="badge badge-danger">P0</span>
    </div>
  </div>
</div></body></html>
