<!-- @dsCard group="Actions" name="Button" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Button — AgentsFramework UI</title><link rel="stylesheet" href="../../_ds_bundle/styles.css"></head>
<body><div class="ds-preview">
  <div class="ds-label">Button · Actions · §2.6 Cursor warm-neutral</div>
  <div class="ds-section"><div class="ds-label">Variants</div>
    <div class="ds-row">
      <button class="btn btn-default btn-md">Default</button>
      <button class="btn btn-outline btn-md">Outline</button>
      <button class="btn btn-ghost btn-md">Ghost</button>
    </div>
  </div>
  <div class="ds-section"><div class="ds-label">Sizes</div>
    <div class="ds-row" style="align-items:center">
      <button class="btn btn-default btn-sm">Small</button>
      <button class="btn btn-default btn-md">Medium</button>
      <button class="btn btn-default btn-lg">Large</button>
      <button class="btn btn-outline btn-icon" title="Icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <div class="ds-section"><div class="ds-label">Disabled</div>
    <div class="ds-row">
      <button class="btn btn-default btn-md" disabled>Disabled default</button>
      <button class="btn btn-outline btn-md" disabled>Disabled outline</button>
    </div>
  </div>
  <div class="ds-section"><div class="ds-label">Dark mode</div>
    <div class="ds-row" data-theme="dark" style="background:var(--color-bg);padding:16px;border-radius:var(--radius-lg)">
      <button class="btn btn-default btn-md">Default</button>
      <button class="btn btn-outline btn-md">Outline</button>
      <button class="btn btn-ghost btn-md">Ghost</button>
    </div>
  </div>
</div></body></html>
