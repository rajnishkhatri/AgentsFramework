<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentsFramework UI — iPad</title>
<link rel="stylesheet" href="../_ds_bundle/styles.css">
<style>
  body{margin:0;background:#e7e3dd;font-family:var(--font-sans)}
  .canvas{min-width:max-content;min-height:100vh;box-sizing:border-box;padding:48px;display:flex;flex-direction:column;gap:40px;align-items:flex-start}
  .stage{display:flex;flex-direction:column;gap:14px}
  .stage-label{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#6b6157}
  .ipad-wrap{zoom:0.62}

  /* ---- iPad bezel (landscape) ---- */
  .ipad{position:relative;width:1194px;height:834px;background:#0b0b0b;border-radius:38px;padding:16px;box-sizing:border-box;
    box-shadow:0 2px 6px rgba(0,0,0,.18),0 40px 80px -24px rgba(0,0,0,.45),0 0 0 2px #1c1c1c,0 0 0 7px #2e2e2e,0 0 0 9px #161616}
  .ipad-cam{position:absolute;top:50%;left:7px;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:#2a2a2a;z-index:60}
  .ipad-screen{position:relative;width:100%;height:100%;border-radius:24px;overflow:hidden;background:var(--color-bg);display:flex;flex-direction:column}

  /* ---- status bar ---- */
  .ipad-status{flex:none;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:14px;font-weight:600;color:var(--color-fg)}
  .ipad-status .r{display:flex;align-items:center;gap:7px}

  .ipad-body{flex:1;display:grid;grid-template-columns:316px 1fr;overflow:hidden}

  /* ---- sidebar (native iPadOS sidebar material + hairline) ---- */
  .side{border-right:0.5px solid color-mix(in oklab,var(--color-fg) 14%,transparent);display:flex;flex-direction:column;gap:14px;padding:14px;overflow:hidden;background:color-mix(in oklab,var(--color-bg) 96%,var(--color-fg) 4%)}
  .side-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .brand{font-size:17px;font-weight:600;color:var(--color-fg);display:flex;align-items:center;gap:8px}
  .brand-dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(180deg,color-mix(in oklab,var(--color-accent) 86%,#fff),var(--color-accent));box-shadow:inset 0 1px 0 color-mix(in oklab,#fff 30%,transparent)}
  .side-icons{display:flex;gap:2px}
  .sbtn{width:34px;height:34px;border:none;background:transparent;color:var(--color-accent);border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
  .sbtn:active{opacity:.5}
  /* native iOS search field — filled gray, no border */
  .side .input{background:color-mix(in oklab,var(--color-fg) 8%,transparent);border-color:transparent;box-shadow:none}
  .side .input:focus{background:color-mix(in oklab,var(--color-fg) 11%,transparent);border-color:transparent;box-shadow:none}
  .newchat{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
  .tabs-list{width:100%;justify-content:stretch}
  .tabs-list .tabs-trigger{flex:1}
  .grouplabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--color-muted);margin:6px 2px 0}
  .threads{display:flex;flex-direction:column;gap:2px;overflow-y:auto}
  .thread{display:flex;flex-direction:column;gap:2px;padding:9px 10px;border-radius:var(--radius-md);cursor:pointer;border:1px solid transparent}
  .thread:hover{background:var(--color-selected)}
  .thread.active{background:var(--color-surface);border-color:var(--color-border);box-shadow:inset 0 1px 0 color-mix(in oklab,#fff 50%,transparent)}
  .thread .t{font-size:14.5px;font-weight:500;color:var(--color-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thread .p{font-size:13px;color:var(--color-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---- chat column ---- */
  .chat{display:flex;flex-direction:column;overflow:hidden}
  .chat-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:0.5px solid color-mix(in oklab,var(--color-fg) 14%,transparent)}
  .chat-title{font-size:17px;font-weight:600;color:var(--color-fg);margin:0}
  .chat-head .r{display:flex;align-items:center;gap:14px}
  .chat-head .email{font-size:14px;color:var(--color-muted)}
  .chat-head .link{font-size:14px;color:var(--color-muted);text-decoration:none;cursor:pointer}
  .convo{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
  .stream{max-width:720px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
  .bubble-user{align-self:flex-end;max-width:78%;background:linear-gradient(180deg,color-mix(in oklab,var(--color-accent) 92%,#fff) 0%,var(--color-accent) 55%,color-mix(in oklab,var(--color-accent) 90%,#000) 100%);color:#fff;border:1px solid color-mix(in oklab,var(--color-accent) 78%,#000);box-shadow:inset 0 1px 0 color-mix(in oklab,#fff 26%,transparent);border-radius:18px;padding:13px 17px;font-size:18px;line-height:1.5}
  .assistant{align-self:flex-start;max-width:88%;display:flex;flex-direction:column;gap:11px}
  .recall{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--color-accent);font-weight:600}
  .answer{font-size:18px;line-height:1.6;color:var(--color-fg)}
  .answer p{margin:0 0 8px}
  .answer ol{margin:4px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
  .answer strong{font-weight:600}
  .meta-row{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--color-muted)}
  .meta-row .badge{white-space:nowrap;flex:none}
  .card-mini{padding:16px 18px}
  .ct{font-size:21px;font-weight:600;color:var(--color-fg);margin:0 0 8px;display:flex;align-items:center;gap:7px;letter-spacing:-.01em}
  .cdesc{font-size:17px;color:var(--color-muted);margin:0 0 12px;line-height:1.5}
  .check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .check li{display:flex;gap:8px;font-size:17px;color:var(--color-fg);line-height:1.45}
  .check svg{flex:none;margin-top:3px;color:var(--color-success)}
  .tool{display:flex;align-items:center;gap:12px}
  .tool-ico{width:34px;height:34px;flex:none;border-radius:8px;background:var(--color-selected);display:inline-flex;align-items:center;justify-content:center;color:var(--color-accent)}
  .tool-name{font-family:var(--font-mono,ui-monospace,monospace);font-size:16px;color:var(--color-fg)}
  .tool-sub{font-size:15px;color:var(--color-muted)}
  .dock{flex:none;padding:14px 22px 18px;border-top:0.5px solid color-mix(in oklab,var(--color-fg) 14%,transparent)}
  .dock .composer{max-width:720px;margin:0 auto}
  .homebar{position:absolute;bottom:7px;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
  .homebar::after{content:"";width:240px;height:5px;border-radius:100px;background:color-mix(in oklab,var(--color-fg) 32%,transparent)}
</style>
</head>
<body>
<div class="canvas" id="canvas"></div>

<template id="screen-tpl">
  <div class="ipad-status">
    <span class="time">9:41</span>
    <span class="r">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7.5" width="3" height="4.5" rx="0.7"/><rect x="4.5" y="5" width="3" height="7" rx="0.7"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.7"/><rect x="13.5" y="0" width="3" height="12" rx="0.7"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 3C10 3 11.9 3.8 13.2 5.1L14.3 4C12.6 2.3 10.4 1.3 8 1.3C5.6 1.3 3.4 2.3 1.7 4L2.8 5.1C4.1 3.8 6 3 8 3Z"/><path d="M8 6.4C9.2 6.4 10.3 6.9 11.1 7.7L12.2 6.6C11 5.5 9.6 4.8 8 4.8C6.4 4.8 5 5.5 3.8 6.6L4.9 7.7C5.7 6.9 6.8 6.4 8 6.4Z"/><circle cx="8" cy="9.8" r="1.4"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="currentColor" stroke-opacity="0.4" fill="none"/><rect x="2" y="2" width="18" height="9" rx="2" fill="currentColor"/><path d="M24 4.5V8.5C24.7 8.2 25.2 7.4 25.2 6.5C25.2 5.6 24.7 4.8 24 4.5Z" fill="currentColor" fill-opacity="0.5"/></svg>
    </span>
  </div>
  <div class="ipad-body">
    <!-- sidebar -->
    <div class="side">
      <div class="side-top">
        <span class="brand"><span class="brand-dot"></span>Threads</span>
        <span class="side-icons">
          <button class="sbtn" title="Search"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
          <button class="sbtn" title="Collapse"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M6 3v10" stroke="currentColor" stroke-width="1.4"/></svg></button>
        </span>
      </div>
      <div class="input-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input class="input input-pill" placeholder="Search threads…">
      </div>
      <button class="btn btn-default btn-md newchat"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>New chat</button>
      <div class="tabs-list"><button class="tabs-trigger active">Chats</button><button class="tabs-trigger">Memory</button></div>
      <div class="grouplabel">Today</div>
      <div class="threads">
        <div class="thread active"><span class="t">Improve memory recall</span><span class="p">Here's a focused five-step plan…</span></div>
        <div class="thread"><span class="t">Planning-stress eval triage</span><span class="p">22/22 passed · 0 regressions</span></div>
        <div class="thread"><span class="t">Native-wrap UI redesign</span><span class="p">Tauri + Capacitor tradeoffs</span></div>
        <div class="grouplabel">Yesterday</div>
        <div class="thread"><span class="t">GoalJudge rubric draft</span><span class="p">Define success conditions for…</span></div>
        <div class="thread"><span class="t">pgvector index tuning</span><span class="p">HNSW vs IVFFlat recall@5</span></div>
        <div class="thread"><span class="t">Trace correlation in Langfuse</span><span class="p">Forward trace_id from backend</span></div>
      </div>
    </div>
    <!-- chat -->
    <div class="chat">
      <div class="chat-head">
        <p class="chat-title">ReAct Agent</p>
        <span class="r"><span class="email">rajnish@studio.dev</span><button class="sbtn" title="Theme"><svg width="17" height="17" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.4" stroke="currentColor" stroke-width="1.4"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1M12.7 12.7l-1.1-1.1M4.4 4.4L3.3 3.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button><span class="link">Sign out</span></span>
      </div>
      <div class="convo">
        <div class="stream">
          <div class="bubble-user">Improve memory recall across sessions — give me a concrete plan.</div>
          <div class="assistant">
            <span class="recall"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 1.5a6.5 6.5 0 1 0 6.5 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>Recalled 3 memories</span>
            <div class="card card-mini">
              <p class="ct"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.4"/><path d="M8 5v3.2l2 1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Understanding the task</p>
              <p class="cdesc">Design a durable cross-session recall improvement, measured against the eval suite.</p>
              <ul class="check">
                <li><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3L13 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Recall@5 improves on the held-out set</li>
                <li><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3L13 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>No regression in latency budget</li>
              </ul>
            </div>
            <div class="card card-mini tool">
              <span class="tool-ico"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
              <div style="flex:1;min-width:0"><div class="tool-name">search_memory</div><div class="tool-sub">3 matches · 98ms</div></div>
              <span class="badge badge-success">Complete</span>
            </div>
            <div class="answer">
              <p>Here's a focused five-step plan:</p>
              <ol>
                <li><strong>Embed on write</strong> — store turn summaries as vectors, not raw text.</li>
                <li><strong>Hybrid recall</strong> — combine semantic + recency scoring.</li>
                <li><strong>Dedup</strong> near-duplicate memories before write.</li>
                <li><strong>Decay</strong> stale facts so recall stays sharp.</li>
                <li><strong>Gate</strong> on the Recall@5 eval before shipping.</li>
              </ol>
            </div>
            <div class="meta-row"><span class="badge badge-default">Composer 2.5 Fast</span><span>✓ done</span></div>
          </div>
        </div>
      </div>
      <div class="dock">
        <div class="composer">
          <button class="composer-iconbtn"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
          <input class="composer-input" placeholder="Send follow-up">
          <button class="composer-model">Composer 2.5 <strong>Fast</strong><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="composer-mic"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="6" y="2" width="4" height="7" rx="2" fill="currentColor"/><path d="M4 8a4 4 0 0 0 8 0M8 12v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        </div>
      </div>
    </div>
  </div>
  <div class="homebar"></div>
</template>

<script>
  const tpl = document.getElementById('screen-tpl').innerHTML;
  const canvas = document.getElementById('canvas');
  for (const mode of ['Light','Dark']) {
    const stage = document.createElement('div');
    stage.className = 'stage';
    stage.innerHTML = `<div class="stage-label">iPad · ${mode}</div>
      <div class="ipad-wrap"><div class="ipad"><div class="ipad-cam"></div>
        <div class="ipad-screen"${mode==='Dark'?' data-theme="dark"':''}>${tpl}</div>
      </div></div>`;
    canvas.appendChild(stage);
  }
</script>
</body>
</html>
