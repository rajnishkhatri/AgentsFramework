<!-- Frozen snapshot v8 (consistency) — archived, not a live card -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Sheet — AgentsFramework UI</title><link rel="stylesheet" href="../../_ds_bundle/styles.css"></head>
<body><div class="ds-preview">
  <div class="ds-label">Sheet · Overlays · mobile thread-list (left) + reasoning panel (bottom)</div>
  <div class="ds-section"><div class="ds-label">Left drawer (mobile thread list)</div>
    <div style="position:relative;height:300px;border:1px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden;background:var(--color-bg)">
      <div style="padding:24px;opacity:.35"><div class="skeleton" style="height:16px;width:60%;margin-bottom:8px"></div><div class="skeleton" style="height:16px;width:45%"></div></div>
      <div style="position:absolute;inset:0;background:rgba(31,30,29,.4)"></div>
      <div style="position:absolute;top:0;left:0;bottom:0;width:72%;max-width:280px;background:var(--color-surface);border-right:1px solid color-mix(in oklab, var(--color-fg) 12%, transparent);padding:20px;box-shadow:inset -1px 0 0 color-mix(in oklab, #fff 50%, transparent), 8px 0 32px -8px color-mix(in oklab, #000 38%, transparent)">
        <button style="position:absolute;right:12px;top:12px;background:none;border:none;cursor:pointer;color:var(--color-muted)">✕</button>
        <div class="sheet-title">Threads</div>
        <div class="tabs-list" style="margin-bottom:12px"><button class="tabs-trigger active">Chats</button><button class="tabs-trigger">Memory</button></div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <div class="card" style="padding:10px"><p class="text-sm text-fg">Planning run · 2 min ago</p></div>
          <div class="card" style="padding:10px"><p class="text-sm text-fg">Memory probe</p></div>
          <div class="card" style="padding:10px"><p class="text-sm text-muted">GoalJudge eval</p></div>
        </div>
      </div>
    </div>
  </div>
  <div class="ds-section"><div class="ds-label">Bottom sheet (reasoning panel)</div>
    <div style="position:relative;height:300px;border:1px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden;background:var(--color-bg)">
      <div style="padding:24px;opacity:.35"><div class="skeleton" style="height:16px;width:60%;margin-bottom:8px"></div><div class="skeleton" style="height:16px;width:45%"></div></div>
      <div style="position:absolute;inset:0;background:rgba(31,30,29,.4)"></div>
      <div style="position:absolute;bottom:0;left:0;right:0;max-height:65%;background:var(--color-surface);border-top:1px solid color-mix(in oklab, var(--color-fg) 12%, transparent);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:20px;box-shadow:inset 0 1px 0 color-mix(in oklab, #fff 60%, transparent), 0 -8px 32px -8px color-mix(in oklab, #000 38%, transparent)">
        <button style="position:absolute;right:12px;top:12px;background:none;border:none;cursor:pointer;color:var(--color-muted)">✕</button>
        <div class="sheet-title">Reasoning</div>
        <p class="text-sm text-muted">T2 reflexion · step 2 of 3 · depth L1</p>
        <div style="margin-top:12px;display:flex;flex-direction:column;gap:6px">
          <div class="skeleton" style="height:12px;width:90%"></div>
          <div class="skeleton" style="height:12px;width:70%"></div>
          <div class="skeleton" style="height:12px;width:80%"></div>
        </div>
      </div>
    </div>
  </div>
</div></body></html>
