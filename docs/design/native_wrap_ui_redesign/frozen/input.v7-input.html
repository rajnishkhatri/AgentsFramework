<!-- Frozen snapshot v7 (input) — archived, not a live card -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Input — AgentsFramework UI</title><link rel="stylesheet" href="../../_ds_bundle/styles.css"></head>
<body><div class="ds-preview">
  <div class="ds-label">Input · Forms · sidebar search, form fields</div>

  <div class="ds-section"><div class="ds-label">Pill search — composer-matched (sidebar)</div>
    <div class="input-icon" style="max-width:320px">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input class="input input-pill" type="text" placeholder="Search threads…">
    </div>
  </div>

  <div class="ds-section"><div class="ds-label">Default field — unified focus ring</div>
    <input class="input" style="max-width:320px" type="text" placeholder="Search threads…">
  </div>

  <div class="ds-section"><div class="ds-label">With label</div>
    <div class="ds-col" style="max-width:320px">
      <label style="font-size:.875rem;font-weight:500;color:var(--color-fg)">Name</label>
      <input class="input" type="text" value="Rajnish Khatri">
    </div>
  </div>

  <div class="ds-section"><div class="ds-label">Focused (accent ring)</div>
    <input class="input" style="max-width:320px;border-color:color-mix(in oklab, var(--color-accent) 55%, var(--color-border));box-shadow:0 0 0 3px var(--color-accent-light)" type="text" value="memory recall">
  </div>

  <div class="ds-section"><div class="ds-label">Disabled</div>
    <input class="input" style="max-width:320px" type="text" placeholder="Disabled field" disabled>
  </div>

  <div class="ds-section"><div class="ds-label">Dark mode</div>
    <div data-theme="dark" style="background:var(--color-bg);padding:16px;border-radius:var(--radius-lg);max-width:352px;display:flex;flex-direction:column;gap:14px">
      <div class="input-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input class="input input-pill" type="text" placeholder="Search threads…">
      </div>
      <input class="input" type="text" placeholder="Form field">
    </div>
  </div>
</div></body></html>
